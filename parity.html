<!doctype html>
<!-- 草稿：函数的奇偶性（白板大字版 + 平移与对称性）。写完后用 inline.py 打包。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>函数的奇偶性</title>
<style>/* 白板互动教学设计系统 · 样式。由 scripts/inline.py 整段拼进页面，不要手抄或删减。
 * 页面的全部颜色、字号、间距、圆角、阴影只在 :root 定义；改主题只改这一段。 */

:root {
  /* 中性色：墨蓝灰 */
  --surface: #FFFFFF;   /* 画布、讲解面板；图中标签的白色描边 */
  --page: #F3F6FA;      /* 画布底色：标题行、控件行，衬出白色实验区卡片 */
  --fill: #E4E9EF;      /* 画布外背景、状态标签、讲解进度条未完成段 */
  --line: #C9D2DC;      /* 网格线、滑轨、分隔线 */
  --guide: #7D8C9C;     /* 坐标轴、刻度线、标注线、示意线 */
  --text-2: #566475;    /* 操作提示、读数名称、刻度数字 */
  --text-1: #1F2D3D;    /* 正文、标题、读数；键盘焦点轮廓 */
  --mask: rgba(31, 45, 61, 0.45);
  /* 功能色 */
  --brand-tint: #DDFCE5;    /* 浅绿：讲解页章节标签、要点条 */
  --on-fill: #1AC87C;       /* 绿：开启状态、当前选项 */
  --correct-text: #00784E;  /* 正确反馈 */
  --emphasis-fill: #FFF0A0; /* 荧光笔黄：焦点读数、结论、所求 */
  /* 质感：实验区、讲解面板是浮在 --page 上的卡片；按钮、切换组、工具条轻微凸起 */
  --shadow-card: 0 4px 24px rgba(31, 45, 61, 0.08), 0 1px 3px rgba(31, 45, 61, 0.06);
  --shadow-raise: 0 2px 6px rgba(31, 45, 61, 0.10);
  /* 语义色：线条 / 区域填充。橙、紫对白底不到 3:1，观察对象同时要有名称标签和线型。 */
  --subject-line: #2D55B2; --subject-fill: #B2DDFF; /* 主体：器材、已知图形 */
  --observe-line: #FE752D; --observe-fill: #FFDAB0; /* 焦点：光线、动点、轨迹、函数图像、所求面积 */
  --compare-line: #B478FF; --compare-fill: #DFD2FF; /* 对照：像、比较位置 */
  --alert-line: #C1361A;   --alert-fill: #FFD6C2;   /* 临界：越界、临界状态、错误 */
  /* 分类色：并列的同类对象按序号取色，如四条航线、七个气压带、几类植物。取自 Okabe-Ito 色盲安全色板：
   * 两两 ΔE 正常视觉 22.2、红绿色盲 12.5。同屏最多 6 种；仍要配名称标签，橙、天蓝对白底不到 3:1。 */
  --cat-1-line: #0072B2; --cat-1-fill: #CCE3F2;  /* 蓝 */
  --cat-2-line: #E69F00; --cat-2-fill: #FBE7B8;  /* 橙黄 */
  --cat-3-line: #009E73; --cat-3-fill: #C4EBDD;  /* 绿 */
  --cat-4-line: #CC79A7; --cat-4-fill: #F3DDEA;  /* 粉紫 */
  --cat-5-line: #56B4E9; --cat-5-fill: #D9EFFB;  /* 天蓝 */
  --cat-6-line: #D55E00; --cat-6-fill: #F8D9C2;  /* 朱红 */
  /* 场景色：画天空、水面、陆地、植物、岩石这类背景区域，让示意图有环境感；只做底色，不画观察对象 */
  /* 器材风格「线描 + 材质」：所有器材用同一种墨线勾轮廓（像课本插图，远看也认得出），轮廓里按真实材料上色，每件只加一道高光。
   * 观察对象（指针、滑片、液面、光线、火焰）仍用焦点色，最醒目。接线柱按教材：负接线柱黑、正接线柱红 */
  --ink: #23272E; --outline: 3px;               /* 器材轮廓线 */
  --meter-hi: #4B525D; --meter-lo: #262A31;     /* 电表黑色胶木壳 */
  --liquid-hi: #B4E0F8; --liquid-lo: #5EAFE4;   /* 液体上浅下深 */
  --case: #F8F9FB; --case-line: #4B5766;        /* 电表外壳、电池盒 */
  --metal: #D5DBE2; --metal-line: #6B7785;      /* 金属杆、刀片、支架 */
  --ceramic: #F6EEE2; --ceramic-line: #A8977C;  /* 瓷筒、瓷底座、电阻体 */
  --copper: #B8682E;                            /* 电阻线圈 */
  --cell: #33404F; --cell-cap: #D7A23A;         /* 干电池、正极帽 */
  --wood: #D9B58C; --wood-line: #8A6646;        /* 木底座 */
  --grip: #2B2F36; --term-pos: #D23A2A;         /* 手柄、负接线柱；正接线柱 */
  --case-hi: #FFFFFF; --case-lo: #E2E7ED; --dial-lo: #F7F4EC;   /* 外壳上下渐变、表盘底 */
  --metal-hi: #F2F5F8; --metal-lo: #A9B4C0;    /* 金属渐变的亮面、暗面 */
  --glass-line: #6E93B5; --glass-tint: rgba(205, 228, 247, 0.30); --glass-dense: rgba(205, 228, 247, 0.51);   /* 玻璃轮廓、玻璃底色、厚玻璃（透镜、三棱镜）底色 */
  --wax: #F7EEDA; --wax-shade: #DEC99C;   /* 蜡烛 */
  --brass: #D9A944; --brass-hi: #F4D88A; --brass-lo: #A87A22;   /* 黄铜：钩码、砝码 */
  --iron: #3A4049; --iron-hi: #5A626D;          /* 铁架台、铁夹这类黑漆铁件 */
  --rubber: #C4472F;                            /* 橡胶：胶头滴管的胶头、胶塞 */
  --plastic-tint: rgba(240, 236, 210, 0.55);    /* 透明塑料：刻度尺、量角器、三角板 */
  --flame-outer: #FF7A1A; --flame-mid: #FFC93C; --flame-inner: #FFF2B0; --flame-edge: #D9480F; --flame-core: #CFE6FA; --flame-core-line: #4F8FD0;   /* 火焰：外焰、内焰、轮廓；酒精灯焰心 */
  --scene-sky: #E3F2FD; --scene-water: #BFE3F5; --scene-land: #EFE4CC; --scene-plant: #C8E6B9; --scene-rock: #D9DDE2;
  /* 字体：设备自带，页面其他地方只写 var(--font-*) */
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; /* 汉字：Mac / Windows 希沃 / 安卓白板 */
  --font-num: "DIN Alternate", Bahnschrift, sans-serif; /* 读数与滑块数值，配 tabular-nums */
  --font-math: "Times New Roman", serif;                 /* 公式与图中数字 */
  --font-kai: KaiTi, "Kaiti SC", STKaiti, serif;          /* 原文、引文：Windows 楷体 / Mac 楷体 */
  --font-ipa: "Segoe UI", "Lucida Sans Unicode", "Helvetica Neue", Arial, sans-serif;   /* 英语单词和音标：带 IPA 字形 */
  /* 字号：只有 4 级，全班要读的文字不小于 L3 */
  --size-l1: 64px;  /* 读数数值、口诀、答案 */
  --size-l2: 44px;  /* 标题、分组标题、对比数值、原文、独立公式 */
  --size-l3: 32px;  /* 图中标签、正文、选项、读数名称和单位 */
  --size-l4: 28px;  /* 按钮、滑块、操作提示、步骤序号、刻度数字 */
  /* 间距 */
  --space-8: 8px;
  --space-16: 16px;
  --space-24: 24px;
  --space-32: 32px;
  --space-48: 48px;
  /* 圆角：sm 文字里的高亮和图上标签，md 按钮和块，lg 居中面板 */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  /* 线条 */
  --stroke-main: 5px;
  --stroke-focus: 6px;
  --stroke-aux: 4px;
  --stroke-grid: 2px;
  --dash-on: 14px;
  --dash-off: 10px;
  --point-r: 12px;
  /* 画布 */
  --canvas-w-max: 1920px;
  --canvas-w-min: 1440px;
  --canvas-h: 1080px;
  --title-row: 96px;
  --control-row: 112px;
  --stage-inset: 24px;   /* 实验区卡片的左右外边距 */
  --touch-min: 64px;
  /* 透明度 */
  --dim-opacity: 0.45;
}

html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--font-sans); color: var(--text-1); background: var(--fill); }
/* 公式：变量斜体，数字与运算符正体，字号 1.12 倍与汉字等高 */
.bd-var, .bd-math { font-family: var(--font-math); font-size: 1.12em; line-height: 1; font-weight: 400; }
.bd-var { font-style: italic; padding-right: 0.06em; }
.bd-sub, .bd-sup { font-family: var(--font-math); font-size: 0.72em; line-height: 0; }
.bd-italic { font-style: italic; }
tspan.bd-var, tspan.bd-math { font-size: 1.12em; }
tspan.bd-sub, tspan.bd-sup { font-size: 0.72em; }

/* 按钮 */
.bd-btn { flex: none; white-space: nowrap; box-sizing: border-box; height: var(--touch-min); min-width: 128px; padding: 0 var(--space-32); border: 0; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-raise); color: var(--text-1); font: 400 var(--size-l4)/44px var(--font-sans); cursor: pointer; touch-action: manipulation; }
.bd-btn[aria-pressed="true"] { background: var(--on-fill); font-weight: 600; }
.bd-btn:disabled { color: var(--text-2); cursor: default; }
.bd-btn:focus-visible, .bd-seg button:focus-visible { outline: 4px solid var(--text-1); outline-offset: 4px; }
.bd-slider input:focus { outline: none; }
.bd-slider input:focus-visible::-webkit-slider-thumb { border-width: 8px; }
.bd-slider input:focus-visible::-moz-range-thumb { border-width: 8px; }

/* 切换组 */
.bd-seg { flex: none; white-space: nowrap; display: inline-flex; height: var(--touch-min); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-raise); overflow: hidden; }
.bd-seg button { box-sizing: border-box; height: 100%; min-width: 128px; padding: 0 var(--space-32); border: 0; background: transparent; color: var(--text-1); font: 400 var(--size-l4)/44px var(--font-sans); cursor: pointer; touch-action: manipulation; }
.bd-seg button + button { border-left: 2px solid var(--fill); }
.bd-seg button[aria-checked="true"] { background: var(--on-fill); font-weight: 600; border-color: transparent; }
.bd-seg button[aria-checked="true"] + button { border-color: transparent; }

/* 滑块 */
.bd-slider { white-space: nowrap; display: inline-flex; align-items: center; gap: var(--space-16); height: var(--touch-min); font: 400 var(--size-l4)/44px var(--font-sans); }
.bd-slider-name { flex: none; }
.bd-slider input { appearance: none; -webkit-appearance: none; width: 320px; height: var(--touch-min); margin: 0; background: transparent; cursor: pointer; touch-action: none; }
.bd-slider input::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: var(--line); }
.bd-slider input::-moz-range-track { height: 12px; border-radius: 6px; background: var(--line); }
.bd-slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 44px; height: 44px; margin-top: -16px; border-radius: 50%; border: 4px solid var(--text-1); background: var(--surface); box-sizing: border-box; }
.bd-slider input::-moz-range-thumb { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--text-1); background: var(--surface); box-sizing: border-box; }
.bd-slider-value { flex: none; min-width: 128px; font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }

/* 读数：L3 名称 + L1 数值 + L3 单位 */
.bd-reading { display: inline-flex; align-items: baseline; gap: var(--space-8); font: 400 var(--size-l3)/48px var(--font-sans); white-space: nowrap; }
.bd-reading-name { color: var(--text-2); fill: var(--text-2); }
.bd-reading-value { font: 600 var(--size-l1)/72px var(--font-num); font-variant-numeric: tabular-nums; color: var(--text-1); fill: var(--text-1); }
.bd-reading-unit { font-weight: 600; fill: var(--text-1); }
/* 文字作用类：HTML 用 color，SVG 用 fill；字号字重见 design-system.md「文字」 */
.bd-value { font-size: var(--size-l2); font-weight: 600; font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--text-1); fill: var(--text-1); }
.bd-heading { font-size: var(--size-l2); font-weight: 600; font-family: var(--font-sans); color: var(--text-1); fill: var(--text-1); }
.bd-state { display: inline-block; padding: 0 var(--space-16); border-radius: var(--radius-sm); background: var(--fill); font-size: var(--size-l4); line-height: 48px; font-weight: 600; font-family: var(--font-sans); color: var(--text-1); fill: var(--text-1); }
.bd-state-alert { background: var(--alert-fill); }
text.bd-reading-name, tspan.bd-reading-name, text.bd-reading-unit, tspan.bd-reading-unit { font-size: var(--size-l3); font-family: var(--font-sans); }
text.bd-reading-name, tspan.bd-reading-name { font-weight: 400; }
text.bd-heading, text.bd-text { paint-order: stroke; stroke: var(--surface); stroke-width: 8px; stroke-linejoin: round; }
text.bd-text { font: 400 var(--size-l3) var(--font-sans); fill: var(--text-1); }
text.bd-state { dominant-baseline: central; }
.bd-state-box { fill: var(--fill); }
.bd-state-alert .bd-state-box { fill: var(--alert-fill); }
.bd-reading-emphasis { padding: 0 var(--space-16); border-radius: var(--radius-sm); background: var(--emphasis-fill); }
.bd-reading-warning .bd-reading-value, .bd-reading-warning .bd-reading-unit, .bd-reading-note { color: var(--alert-line); }
.bd-reading-note { font-weight: 600; }
.bd-reading [hidden], .bd-reading[hidden] { display: none; }
/* 读数先遮后揭（coverable）：遮住时数值透明，换成灰底「?」 */
.bd-coverable { cursor: pointer; }
.bd-reading.bd-covered :is(.bd-reading-value, .bd-state) { position: relative; min-width: 1.6em; color: transparent; border-radius: var(--radius-sm); background: var(--fill); }
.bd-reading.bd-covered :is(.bd-reading-value, .bd-state)::after { content: '?'; position: absolute; inset: 0; text-align: center; color: var(--text-2); }
.bd-cover { display: none; } .bd-covered .bd-cover { display: inline; } .bd-cover rect { fill: var(--fill); } .bd-cover text { fill: var(--text-2); }
.bd-covered > text > tspan.bd-value { fill-opacity: 0; }

/* 图形 */
.bd-figure { display: block; width: 100%; height: auto; overflow: visible; }
.bd-main { fill: none; stroke-width: var(--stroke-main); stroke-linecap: round; stroke-linejoin: round; }
.bd-aux { fill: none; stroke-width: var(--stroke-aux); stroke-linecap: round; }
.bd-focus { stroke-width: var(--stroke-focus); }
.bd-dim { opacity: var(--dim-opacity); }
/* 焦点转移：切步时只给新焦点加一次，由淡到实，引导视线 */
@keyframes bd-focus-in { from { opacity: var(--dim-opacity); } }
.bd-focus-in { animation: bd-focus-in 300ms ease-out; }
/* 器材（instruments/）：外壳、刻度、接线柱、玻璃、液体、导线、火焰 */
.bd-device { fill: var(--surface); stroke: var(--ink); stroke-width: var(--outline); }
.bd-scale { fill: none; stroke: var(--text-1); stroke-width: 2px; }
.bd-scale-major { stroke-width: 3px; }
.bd-terminal { fill: var(--surface); stroke: var(--ink); stroke-width: 3px; }
.bd-terminal-on { fill: var(--grip); }
.bd-terminal-pos { stroke: var(--term-pos); }
.bd-terminal-pos.bd-terminal-on { fill: var(--term-pos); }
.bd-case { fill: url(#bd-g-case) var(--case); stroke: var(--ink); stroke-width: var(--outline); }
.bd-dial { fill: var(--surface); stroke: var(--line); stroke-width: 2px; }
.bd-metal { fill: var(--metal); stroke: var(--ink); stroke-width: var(--outline); }
.bd-ceramic { fill: var(--ceramic); stroke: var(--ink); stroke-width: var(--outline); }
.bd-coil { fill: none; stroke: var(--copper); stroke-width: 3px; }
.bd-cell { fill: var(--cell); }
.bd-cell-cap { fill: var(--cell-cap); }
.bd-wood { fill: var(--wood); stroke: var(--ink); stroke-width: var(--outline); }
.bd-brass { fill: url(#bd-g-brass) var(--brass); stroke: var(--ink); stroke-width: var(--outline); }
.bd-iron { fill: url(#bd-g-iron) var(--iron); stroke: var(--ink); stroke-width: var(--outline); }
.bd-steel { fill: url(#bd-g-metal) var(--metal); stroke: var(--ink); stroke-width: var(--outline); stroke-linejoin: round; }   /* 带渐变的金属件：测力计外壳、杠杆、滑轮、镜背；.bd-metal 是不带渐变的平涂金属 */
.bd-rubber { fill: var(--rubber); stroke: var(--ink); stroke-width: var(--outline); }
.bd-plastic { fill: var(--plastic-tint); stroke: var(--ink); stroke-width: var(--outline); stroke-linejoin: round; }
.bd-grip { fill: var(--grip); }
.bd-device-dark { fill: var(--grip); stroke: var(--ink); stroke-width: var(--outline); }  /* 电池、底座、旋钮这类实心部件 */
.bd-glass { fill: none; stroke: var(--ink); stroke-width: var(--outline); stroke-linejoin: round; }
.bd-glass-fill { fill: var(--glass-tint); stroke: none; }
.bd-glass-dense { fill: var(--glass-dense); stroke: none; }   /* 厚玻璃：透镜、三棱镜，在白底上看得出 */
.bd-ink { fill: none; stroke: var(--ink); stroke-width: var(--outline); stroke-linecap: round; stroke-linejoin: round; }   /* 器材上的墨线：不填色；和 .bd-dot-* 合用是带墨线轮廓的实心件 */
.bd-thin { stroke-width: 2px; stroke-linejoin: round; }   /* 细墨线：内部细节、小零件，和材质类或 .bd-ink 合用 */
.bd-wax { fill: url(#bd-g-wax) var(--wax); stroke: var(--ink); stroke-width: var(--outline); }
.bd-liquid { fill: url(#bd-g-liquid) var(--subject-fill); }   /* 页面里没有器材外形（没有渐变）时退回纯色 */
.bd-wire { fill: none; stroke: var(--text-1); stroke-width: var(--stroke-aux); stroke-linecap: round; stroke-linejoin: round; }
.bd-dot-wire { fill: var(--text-1); }  /* 导线连接点、电池负极短粗线、变阻器箭头 */
.bd-flame { fill: var(--observe-fill); stroke: var(--observe-line); stroke-width: 3px; }
.bd-dash { stroke-dasharray: var(--dash-on) var(--dash-off); stroke-linecap: butt; }
.bd-guide { stroke: var(--guide); }
.bd-grid { stroke: var(--line); stroke-width: var(--stroke-grid); }
.bd-subject { stroke: var(--subject-line); }
.bd-observe { stroke: var(--observe-line); }
.bd-compare { stroke: var(--compare-line); }
.bd-alert { stroke: var(--alert-line); }
.bd-fill-subject { fill: var(--subject-fill); stroke: var(--subject-line); stroke-width: var(--stroke-main); }
.bd-fill-observe { fill: var(--observe-fill); stroke: var(--observe-line); stroke-width: var(--stroke-main); }
.bd-fill-compare { fill: var(--compare-fill); stroke: var(--compare-line); stroke-width: var(--stroke-main); }
.bd-fill-alert { fill: var(--alert-fill); stroke: var(--alert-line); stroke-width: var(--stroke-main); }
.bd-dot-subject { fill: var(--subject-line); }
.bd-dot-observe { fill: var(--observe-line); }
.bd-dot-compare { fill: var(--compare-line); }
.bd-dot-alert { fill: var(--alert-line); }
.bd-dot-guide { fill: var(--guide); }
.bd-label { font: 600 var(--size-l3) var(--font-sans); paint-order: stroke; stroke: var(--surface); stroke-width: 8px; stroke-linejoin: round; fill: var(--text-1); }
.bd-label.bd-tick { font: 400 var(--size-l4) var(--font-math); fill: var(--text-2); stroke-width: 6px; }
.bd-label.bd-on-dark { fill: #F1F4F7; stroke: none; }   /* 深色器材面上的字，例如电表接线柱旁的量程 */
.bd-knob { stroke: var(--ink); stroke-width: 2.5px; }
.bd-knob-pos { fill: url(#bd-g-knob-red); } .bd-knob-neg { fill: url(#bd-g-knob-black); } .bd-knob-off { fill: var(--metal); }
.bd-shine { fill: none; stroke: #FFFFFF; stroke-opacity: 0.9; stroke-linecap: round; }   /* 器材上的一道白色高光，线宽由 shine() 给 */
/* 标签文字只用 --text-1，身份靠旁边的同色短线 .bd-key-*；越界、错误的文字才用 --alert-line */
.bd-key-subject, .bd-key-observe, .bd-key-compare, .bd-key-alert { fill: none; stroke-width: var(--stroke-focus); stroke-linecap: round; }
.bd-key-subject { stroke: var(--subject-line); }
.bd-key-observe { stroke: var(--observe-line); }
.bd-key-compare { stroke: var(--compare-line); }
.bd-key-alert { stroke: var(--alert-line); }
.bd-text-alert { fill: var(--alert-line); }
/* 分类色：并列对象按序号取色 */
.bd-cat-1 { stroke: var(--cat-1-line); } .bd-fill-cat-1 { fill: var(--cat-1-fill); stroke: var(--cat-1-line); stroke-width: var(--stroke-main); } .bd-dot-cat-1 { fill: var(--cat-1-line); } .bd-key-cat-1 { fill: none; stroke: var(--cat-1-line); stroke-width: var(--stroke-focus); stroke-linecap: round; }
.bd-cat-2 { stroke: var(--cat-2-line); } .bd-fill-cat-2 { fill: var(--cat-2-fill); stroke: var(--cat-2-line); stroke-width: var(--stroke-main); } .bd-dot-cat-2 { fill: var(--cat-2-line); } .bd-key-cat-2 { fill: none; stroke: var(--cat-2-line); stroke-width: var(--stroke-focus); stroke-linecap: round; }
.bd-cat-3 { stroke: var(--cat-3-line); } .bd-fill-cat-3 { fill: var(--cat-3-fill); stroke: var(--cat-3-line); stroke-width: var(--stroke-main); } .bd-dot-cat-3 { fill: var(--cat-3-line); } .bd-key-cat-3 { fill: none; stroke: var(--cat-3-line); stroke-width: var(--stroke-focus); stroke-linecap: round; }
.bd-cat-4 { stroke: var(--cat-4-line); } .bd-fill-cat-4 { fill: var(--cat-4-fill); stroke: var(--cat-4-line); stroke-width: var(--stroke-main); } .bd-dot-cat-4 { fill: var(--cat-4-line); } .bd-key-cat-4 { fill: none; stroke: var(--cat-4-line); stroke-width: var(--stroke-focus); stroke-linecap: round; }
.bd-cat-5 { stroke: var(--cat-5-line); } .bd-fill-cat-5 { fill: var(--cat-5-fill); stroke: var(--cat-5-line); stroke-width: var(--stroke-main); } .bd-dot-cat-5 { fill: var(--cat-5-line); } .bd-key-cat-5 { fill: none; stroke: var(--cat-5-line); stroke-width: var(--stroke-focus); stroke-linecap: round; }
.bd-cat-6 { stroke: var(--cat-6-line); } .bd-fill-cat-6 { fill: var(--cat-6-fill); stroke: var(--cat-6-line); stroke-width: var(--stroke-main); } .bd-dot-cat-6 { fill: var(--cat-6-line); } .bd-key-cat-6 { fill: none; stroke: var(--cat-6-line); stroke-width: var(--stroke-focus); stroke-linecap: round; }
/* 气压带风带（geo.js）：按人教版选择性必修 1 图 3.10、3.11——高压带绿（cat-3），低压带浅紫，风带浅米黄底，风向箭头和环流圈品红 */
:root { --geo-low-line: #9A72CF; --geo-wind-line: #D1287F; --geo-wind-belt: #F7EDD2; }
/* 预制底图的水系：水面色与底图图片里的海一致 */
:root { --geo-water: #CEE5F1; --geo-water-line: #7DB2D3; --geo-water-text: #3A7BA3; }
.bd-geo-coast { fill: none; stroke: var(--geo-water-line); stroke-width: 2px; stroke-linejoin: round; }
.bd-geo-river { fill: none; stroke: var(--geo-water-line); stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; }
.bd-geo-river-major { stroke-width: 4px; }
.bd-geo-lake { fill: var(--geo-water); stroke: var(--geo-water-line); stroke-width: 1.5px; }
.bd-geo-river-name { font: 500 var(--size-l4) var(--font-sans); letter-spacing: 0.2em; fill: var(--geo-water-text); paint-order: stroke; stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; }
.bd-geo-low { stroke: var(--geo-low-line); } .bd-dot-geo-low { fill: var(--geo-low-line); } .bd-key-geo-low { fill: none; stroke: var(--geo-low-line); stroke-width: var(--stroke-focus); stroke-linecap: round; }
.bd-geo-wind { stroke: var(--geo-wind-line); } .bd-dot-geo-wind { fill: var(--geo-wind-line); } .bd-key-geo-wind { fill: none; stroke: var(--geo-wind-line); stroke-width: var(--stroke-focus); stroke-linecap: round; }
/* 场景底色：区域填充，不描边 */
.bd-sky { fill: var(--scene-sky); } .bd-water { fill: var(--scene-water); } .bd-land { fill: var(--scene-land); } .bd-plant { fill: var(--scene-plant); } .bd-rock { fill: var(--scene-rock); }

/* 画布 */
.bd-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--fill); }
.bd-canvas { position: absolute; left: 0; top: 0; width: var(--canvas-w-max); height: var(--canvas-h); background: var(--page); transform-origin: 0 0; font-family: var(--font-sans); color: var(--text-1); }
.bd-titlebar { box-sizing: border-box; display: flex; align-items: center; gap: var(--space-32); height: var(--title-row); padding: 0 var(--space-48); }
.bd-title { margin: 0; font-size: var(--size-l2); line-height: 56px; font-weight: 600; white-space: nowrap; }
.bd-hint { font-size: var(--size-l4); line-height: 40px; color: var(--text-2); white-space: nowrap; }
.bd-problem { flex: 1 1 auto; min-width: 0; font-size: var(--size-l3); line-height: 44px; color: var(--text-1); }
.bd-problem-tag { margin-right: var(--space-16); font-weight: 600; color: var(--text-2); }
.bd-problem strong { font-weight: 600; background: var(--emphasis-fill); border-radius: var(--radius-sm); padding: 0 var(--space-8); }
.bd-split { position: absolute; inset: 0; display: flex; justify-content: center; align-items: stretch; }
.bd-split > svg { flex: none; height: 100%; }
.bd-titlebar.bd-compact .bd-hint:not(.bd-hint-step) { display: none; }
.bd-titlebar.bd-compact:has(.bd-hint-step) .bd-title { display: none; }   /* 按步推进时那一句比标题要紧，放不下就隐藏标题 */
.bd-hint-step { color: var(--text-1); }
.bd-step-count { margin-right: var(--space-16); font-family: var(--font-num); color: var(--text-2); }
.bd-readings { display: flex; align-items: baseline; gap: var(--space-32); margin-left: auto; }
.bd-stage { position: relative; height: calc(var(--canvas-h) - var(--title-row) - var(--control-row)); margin: 0 var(--stage-inset); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }
.bd-stage > svg, .bd-stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.bd-stage > .bd-readings { position: absolute; top: var(--space-16); right: var(--space-24); }
.bd-stage { touch-action: none; }   /* 捏合交给 zoomable，不让浏览器缩放整页 */
.bd-zoom-reset { position: absolute; right: var(--space-16); bottom: var(--space-16); z-index: 1; }
.bd-zoom-reset[hidden] { display: none; }
.bd-stage:has(> .bd-mask-side:not([hidden])) > .bd-zoom-reset { right: calc(max(45%, 640px) + var(--space-16) + var(--space-16)); }   /* 讲解打开时让到面板左边 */
.bd-stage > .bd-note { position: absolute; left: var(--space-24); bottom: var(--space-16); margin: 0; padding: 0 var(--space-16); border-radius: var(--radius-sm); background: var(--surface); font-size: var(--size-l4); line-height: 48px; color: var(--text-2); }
/* 图上热点标签：pin() 生成，跟着 SVG 一起放大 */
.bd-pin { cursor: pointer; pointer-events: auto; }
.bd-pin-box { fill: var(--surface); }
.bd-pin-current .bd-pin-box { fill: var(--on-fill); }
.bd-pin-text { font: 600 var(--size-l3) var(--font-sans); fill: var(--text-1); dominant-baseline: central; }
.bd-pin-stem { stroke: var(--surface); stroke-width: 4px; }
.bd-pin-dot { fill: var(--text-1); stroke: var(--surface); stroke-width: 4px; }
.bd-controls { box-sizing: border-box; display: flex; align-items: center; gap: var(--space-32); height: var(--control-row); padding: 0 var(--space-48); }
.bd-controls .bd-reset { margin-left: auto; }
.bd-controls .bd-slider, .bd-controls .bd-playback { flex: 1 1 0; min-width: 0; max-width: 640px; }
.bd-controls .bd-slider input, .bd-controls .bd-playback .bd-slider input { flex: 1 1 auto; width: auto; min-width: 160px; }

/* 播放控制 */
.bd-playback { display: inline-flex; align-items: center; gap: var(--space-16); }
.bd-playback > .bd-btn { min-width: 112px; }
.bd-playback .bd-slider { flex: 1 1 auto; }

/* 拖动点：浅色光圈提示可拖动，拖动中光圈放大 */
.bd-handle-hit { fill: transparent; cursor: grab; touch-action: none; }
.bd-handle.bd-dragging .bd-handle-hit { cursor: grabbing; }
.bd-handle-halo { transition: r 120ms ease-out; }
.bd-handle.bd-dragging .bd-handle-halo { r: 36px; }
.bd-handle-idle .bd-handle-halo { animation: bd-breathe 1.6s ease-in-out infinite; }   /* 没人操作过时呼吸，提示可以动 */
@keyframes bd-breathe { 50% { r: 40px; } }
.bd-handle-ring { fill: none; stroke: var(--handle-line); stroke-width: 4px; stroke-dasharray: 12 8; transition: r 120ms ease-out; }   /* 套在器材上的拖动点：空心虚线圈，不挡住器材 */
.bd-handle.bd-dragging .bd-handle-ring { r: 44px; stroke-dasharray: none; }
.bd-handle-idle .bd-handle-ring { animation: bd-ring 1.6s ease-in-out infinite; }
@keyframes bd-ring { 50% { r: 44px; } }
/* 氛围动效：美术文件里给部件加类名即可。只做装饰、不表达数值；系统要求减少动态效果时停下（检查脚本也按这个截图） */
.bd-flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: bd-flicker 1.3s ease-in-out infinite alternate; }
.bd-flicker-fast { transform-box: fill-box; transform-origin: 50% 100%; animation: bd-flicker 0.9s ease-in-out infinite alternate-reverse; }
.bd-glow-pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: bd-glow 2.2s ease-in-out infinite alternate; }
@keyframes bd-flicker { 0% { transform: scale(1, 1) skewX(0deg); } 30% { transform: scale(0.96, 1.05) skewX(-2deg); } 60% { transform: scale(1.03, 0.97) skewX(1.5deg); } 100% { transform: scale(0.98, 1.03) skewX(-1deg); } }
@keyframes bd-glow { from { opacity: 0.75; transform: scale(0.96); } to { opacity: 1; transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .bd-handle-idle .bd-handle-halo, .bd-handle-idle .bd-handle-ring, .bd-flicker, .bd-flicker-fast, .bd-glow-pulse { animation: none; } }
.bd-handle-arrow { stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; paint-order: stroke; pointer-events: none; }
.bd-handle-track { stroke: var(--handle-line); stroke-width: 6px; stroke-linecap: round; stroke-dasharray: 2 14; opacity: 0.6; pointer-events: none; }   /* 拖动范围 */
.bd-handle-chip { cursor: pointer; }
.bd-handle-chip rect { fill: var(--surface); stroke: var(--handle-line); stroke-width: 3px; }
.bd-handle-chip text { font: 400 var(--size-l4) var(--font-sans); fill: var(--text-1); }
.bd-halo-subject { fill: var(--subject-fill); }
.bd-halo-observe { fill: var(--observe-fill); }
.bd-halo-compare { fill: var(--compare-fill); }
.bd-halo-alert { fill: var(--alert-fill); }
.bd-halo-cat-1 { fill: var(--cat-1-fill); }
.bd-halo-cat-2 { fill: var(--cat-2-fill); }
.bd-halo-cat-3 { fill: var(--cat-3-fill); }
.bd-halo-cat-4 { fill: var(--cat-4-fill); }
.bd-halo-cat-5 { fill: var(--cat-5-fill); }
.bd-halo-cat-6 { fill: var(--cat-6-fill); }

/* 答题 */
.bd-choice-question { margin: 0 0 var(--space-24); }
.bd-choice-options { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-16) var(--space-24); }
.bd-choice-option { font-size: var(--size-l3); display: flex; align-items: center; gap: var(--space-16); text-align: left; border: 4px solid transparent; }
.bd-choice-key { font-weight: 600; color: var(--text-2); }
.bd-choice-option.bd-chosen-correct { border-color: var(--correct-text); font-weight: 600; }
.bd-choice-option.bd-chosen-wrong { border-color: var(--alert-line); }
.bd-choice-feedback { margin: var(--space-24) 0 0; }
.bd-choice [hidden] { display: none; }

/* 讲解：默认停靠右侧，实验区左侧和控件行仍可见 */
.bd-mask[hidden], .bd-panel [hidden] { display: none; }
.bd-mask { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; background: var(--mask); }
.bd-mask-side { inset: calc(var(--title-row) + var(--space-16)) var(--space-48) calc(var(--control-row) + var(--space-16)) auto; width: 45%; min-width: 640px; background: none; align-items: stretch; }
.bd-stage > .bd-mask-side { top: var(--space-16); right: var(--space-16); bottom: var(--space-16); }
.bd-stage:has(> .bd-readings) > .bd-mask-side { top: calc(88px + var(--space-16)); }   /* 让开右上角读数 */
.bd-panel { box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-24); width: 1200px; max-height: 100%; padding: var(--space-48); border-radius: var(--radius-lg); background: var(--surface); }
.bd-mask-side .bd-panel { width: 100%; padding: var(--space-32); border: 2px solid var(--fill); box-shadow: var(--shadow-card); }
.bd-panel-head { display: flex; align-items: center; gap: var(--space-24); }
.bd-panel-title { margin: 0; font-size: var(--size-l2); line-height: 56px; font-weight: 600; }
.bd-panel-head .bd-btn { margin-left: auto; background: none; box-shadow: none; }   /* 收起不抢标题 */
.bd-panel-progress { display: flex; align-items: center; gap: var(--space-8); }
.bd-panel-mark { flex: 1 1 0; height: 40px; padding: 0; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
.bd-panel-mark span { display: block; height: 8px; border-radius: 4px; background: var(--fill); }
.bd-panel-mark.bd-done span { background: var(--guide); }
.bd-panel-mark.bd-current span { background: var(--text-1); }
.bd-panel-mark:focus-visible { outline: 4px solid var(--text-1); outline-offset: 2px; }
.bd-panel-step { flex: none; min-width: 72px; text-align: right; font: 400 var(--size-l4)/40px var(--font-num); color: var(--text-2); }
.bd-panel-body { flex: 1; font-size: var(--size-l3); line-height: 48px; }
.bd-panel-body p, .bd-panel-body ul, .bd-panel-body ol { margin: 0 0 var(--space-32); }
.bd-panel-body ul, .bd-panel-body ol { padding-left: 1.5em; }
.bd-panel-body li + li { margin-top: var(--space-16); }
.bd-panel-subtitle { margin: 0 0 var(--space-16); font-size: var(--size-l3); line-height: 48px; font-weight: 600; }
.bd-display { margin: 0 0 var(--space-32); text-align: center; font-size: var(--size-l2); line-height: 72px; }
.bd-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 0.1em; font-size: 0.8em; line-height: 1.15; }
.bd-frac > span:first-child { padding: 0 0.15em; border-bottom: 2px solid currentColor; }
.bd-conclusion { padding: var(--space-16) var(--space-24); border-radius: var(--radius-md); background: var(--emphasis-fill); font-weight: 600; }
/* 讲解的主块和辅助说明：原文、字词注释、补充一句 */
.bd-quote { margin: 0 0 var(--space-32); padding-left: var(--space-24); border-left: 6px solid var(--guide); font-family: var(--font-kai); font-size: var(--size-l2); line-height: 64px; }
.bd-quote strong { font-weight: 600; background: var(--emphasis-fill); border-radius: var(--radius-sm); padding: 0 var(--space-8); }
.bd-quote cite { display: block; margin-top: var(--space-8); font: normal 400 var(--size-l3)/48px var(--font-sans); color: var(--text-2); }
.bd-terms { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-16) var(--space-24); margin: 0 0 var(--space-32); }
.bd-terms dt { font-weight: 600; }
.bd-terms dd { margin: 0; color: var(--text-2); }
.bd-aside { color: var(--text-2); }
.bd-correct { color: var(--correct-text); font-weight: 600; }
.bd-wrong { color: var(--alert-line); font-weight: 600; }
.bd-panel-foot { display: flex; gap: var(--space-16); }
.bd-panel-foot > :nth-child(2) { margin-left: auto; }   /* 上一步靠左，下一步靠右 */

/* 图标：随文字字号缩放，控件内 32 px */
.bd-icon { flex: none; width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.bd-icon-filled { fill: currentColor; stroke: none; }
.bd-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8); }
.bd-btn .bd-icon { width: 32px; height: 32px; }
.bd-btn-icon { min-width: 64px; width: 64px; padding: 0; }
.bd-reading-note .bd-icon { margin-right: var(--space-8); }

/* 对象工具条：贴在被点中的对象上方，跟着对象算，不计入控件数 */
.bd-tool { position: absolute; z-index: 1; display: inline-flex; gap: var(--space-8); padding: var(--space-8); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-card); }
.bd-tool[hidden] { display: none; }
.bd-tool .bd-btn { min-width: var(--touch-min); padding: 0 var(--space-16); border-radius: var(--radius-sm); box-shadow: none; background: var(--fill); }   /* 外框贴着按钮，内层降一档 */

/* 按步推进：上一步 / 下一步，整组算一组控件 */
.bd-step { flex: none; display: inline-flex; gap: var(--space-8); }

/* 方向组：一组紧挨的方向按钮，整组算一组控件 */
.bd-dpad { flex: none; display: inline-flex; gap: var(--space-8); }
.bd-dpad .bd-btn { min-width: var(--touch-min); padding: 0 var(--space-16); }

/* 控件行的动作组 */
.bd-actions { display: flex; align-items: center; gap: var(--space-16); margin-left: auto; }
.bd-actions .bd-reset { margin-left: 0; }

/* 讲解与答题的图标 */
.bd-choice-feedback { display: flex; align-items: flex-start; gap: var(--space-8); }
.bd-choice-feedback .bd-icon { width: 40px; height: 40px; margin-top: 4px; stroke-width: 3; }

/* 全屏按钮：标题行最右，fitCanvas 自动加，不计入控件数 */
.bd-titlebar .bd-fullscreen { margin-left: var(--space-16); box-shadow: none; background: none; color: var(--text-2); }
.bd-titlebar:not(:has(.bd-readings)) .bd-fullscreen { margin-left: auto; }

/* 生物：细胞、器官、显微镜（instruments/biology.js）。结构按真实颜色上色，外轮廓用墨线；血液按含氧多少分红、蓝紫两色 */
:root {
  --bio-wall: #DDE7AE; --bio-wall-lo: #BCCD7C;              /* 细胞壁：淡黄绿 */
  --bio-membrane: #F0C25A;                                  /* 细胞膜：金黄色细带 */
  --bio-cytoplasm: #F6F8E4; --bio-cytoplasm-animal: #FCEDE3; /* 细胞质：植物淡黄绿，动物淡粉 */
  --bio-granule: #C8CE9C;                                   /* 细胞质里的小颗粒 */
  --bio-nucleus: #8A68C2; --bio-nucleus-hi: #CDB8EE; --bio-nucleolus: #57398A;   /* 细胞核、核仁 */
  --bio-vacuole: #E3F2FC; --bio-vacuole-lo: #A9D3F1;        /* 液泡：淡蓝 */
  --bio-chloroplast: #4C9F42; --bio-chloroplast-hi: #A2D97E; --bio-grana: #2A6B25;   /* 叶绿体和里面的基粒 */
  --bio-mito: #E66F78; --bio-mito-hi: #F9C9CC; --bio-cristae: #9E2F3A;            /* 线粒体和嵴：人教版新版图 1-12、1-13 为红粉色 */
  --bio-artery: #D23B34;                                    /* 动脉血：鲜红 */
  --bio-vein: #6657B4;                                      /* 静脉血：蓝紫 */
  --bio-muscle: #F0B7A6; --bio-muscle-lo: #D98570;          /* 心肌 */
  --bio-valve: #FBF0DA;                                     /* 瓣膜 */
  --scope-band-low: #E9B523; --scope-band-high: #2F8AD6;    /* 物镜色环：低倍黄、高倍蓝 */
  --scope-mirror: #DDE9F2;                                  /* 反光镜镜面 */
}
.bd-bio-wall { fill: url(#bd-g-wall) var(--bio-wall); stroke: var(--ink); stroke-width: var(--outline); fill-rule: evenodd; }
.bd-bio-membrane { fill: none; stroke: var(--bio-membrane); stroke-width: 3px; }
.bd-bio-cytoplasm { fill: var(--bio-cytoplasm); }
.bd-bio-cytoplasm-animal { fill: var(--bio-cytoplasm-animal); }
.bd-bio-granule { fill: var(--bio-granule); }
.bd-bio-nucleus { fill: url(#bd-g-nucleus) var(--bio-nucleus); stroke: var(--ink); stroke-width: var(--outline); }
.bd-bio-nucleolus { fill: var(--bio-nucleolus); }
.bd-bio-vacuole { fill: url(#bd-g-vacuole) var(--bio-vacuole); stroke: var(--ink); stroke-width: 2.5px; }
.bd-bio-chloroplast { fill: url(#bd-g-chloroplast) var(--bio-chloroplast); stroke: var(--ink); stroke-width: 2px; }
.bd-bio-grana { fill: var(--bio-grana); }
.bd-bio-mito { fill: url(#bd-g-mito) var(--bio-mito); stroke: var(--ink); stroke-width: 2px; }
.bd-bio-cristae { fill: none; stroke: var(--bio-cristae); stroke-width: 2px; stroke-linejoin: round; }
.bd-bio-artery { fill: var(--bio-artery); stroke: var(--ink); stroke-width: var(--outline); stroke-linejoin: round; }
.bd-bio-vein { fill: var(--bio-vein); stroke: var(--ink); stroke-width: var(--outline); stroke-linejoin: round; }
.bd-bio-blood-a { fill: var(--bio-artery); }

  --bio-tissue: #E6EDB2; --bio-tissue-lo: #9DC468;          /* 植物切面：淡黄绿，向花柄变绿 */

  --bio-pollen: #F6C52E;                                    /* 花粉 */
  --bio-testa: #8A4325; --bio-testa-hi: #B5683D; --bio-testa-lo: #5A2614;   /* 菜豆种皮：红褐色 */
  --bio-cotyledon: #F8DFC9; --bio-cotyledon-lo: #EEC4A4;   /* 菜豆子叶：淡肉色 */
  --bio-embryo: #FCF3E4;                                    /* 胚根、胚轴：乳白 */
  --bio-pericarp: #E8762F; --bio-pericarp-lo: #C95A1D;      /* 玉米果皮和种皮：橙红 */
  --bio-endosperm: #F2B94E; --bio-endosperm-hi: #F9D88C; --bio-endosperm-lo: #E0952D;   /* 玉米胚乳：金黄 */

  --bio-palisade: #7BBF52; --bio-spongy: #A3D27A; --bio-chloro: #2F7A2B;   /* 栅栏状、海绵状叶肉细胞，叶绿体 */
  --bio-airspace: #4F7F40;                                  /* 叶肉细胞间隙（暗处） */
  --bio-xylem: #C2456B; --bio-phloem: #A88BDB; --bio-bundle: #DCEFC4;   /* 叶脉：导管、筛管、维管束鞘 */
  --bio-h2o: #7CC6EE;                                       /* 水蒸气 */
  --bio-root: #E5EEB6; --bio-root-elong: #EDF3C8; --bio-meristem: #CDE08C; --bio-rootcap: #D3ECEF; --bio-stele: #D6E59E;   /* 根尖各区：淡黄绿，分生区深一些，根冠淡蓝 */

/* 生物·人体（biology.js）：心脏工作、血液循环、消化系统、泌尿系统、肾单位。器官按真实颜色，血管按含氧多少分红、蓝紫；
 * 管道（血管、消化道、肾小管）先描粗墨线再压一道填色；食物团用焦点色，尿的形成里的物质各一色 */
:root {
  --bio-net-hole: #FBEDEA;                                                  /* 毛细血管网的网眼 */

  --bio-stomach: #F0A586; --bio-stomach-hi: #F9CDB8; --bio-stomach-lo: #D9805F;   /* 胃 */
  --bio-gullet: #E8957E;                                                    /* 食道 */
  --bio-gut-s: #F8C99A; --bio-gut-s-lo: #E2A26A;                            /* 小肠：浅橙黄 */
  --bio-gut-l: #E9907C; --bio-gut-l-lo: #C26450;                            /* 大肠：橙红，结肠袋横纹 */
  --bio-kidney: #B5503D; --bio-kidney-hi: #D77A62; --bio-kidney-lo: #7E3326;   /* 肾：红褐 */
  --bio-medulla: #8E3A2E; --bio-stria: #6A2A22; --bio-pelvis: #F5E3BC;        /* 肾锥体、肾盂 */
  --bio-ureter: #EFCFA6;                                                      /* 输尿管、尿道 */
  --bio-bladder: #EDB48E; --bio-bladder-in: #FBE9D8;                          /* 膀胱壁、空的膀胱腔 */
  --bio-urine: #F5D35A; --bio-filtrate: #FBEDB2;                              /* 尿液、原尿 */
  --bio-tubule: #E8C48A;                                                      /* 肾小管、肾小囊的壁 */
  --bio-water: #5DB4EE; --bio-glucose: #5DB45A; --bio-salt: #F4F6F8; --bio-urea: #B7782C; --bio-protein: #9468C8;   /* 尿的形成里的颗粒 */
}

/* 生物·动物：家鸽、鱼、青蛙、食物网和生态系统的小图。生物结构平涂，同一结构一种颜色；外轮廓 3px 墨线，内部分界 2px */

/* 电学：教材实验器材的浅蓝灰底座和支架、金色干电池、绕线、白瓷管、滚花接线柱 */
:root {
  --elec-base-hi: #D5DFEC; --elec-base: #AEBCD2; --elec-base-lo: #8495B1;   /* 浅蓝灰底座、支架、手柄：顶面、正面、暗面 */
  --elec-cell-hi: #F8EBB0; --elec-cell: #DDB850; --elec-cell-lo: #A47B1E;   /* 干电池的金色外皮 */
  --elec-coil-hi: #EDAA5E; --elec-coil-lo: #7A3B12;   /* 电阻线的亮面、暗面，中间色是 --copper */
  --elec-red-hi: #FF8A78; --elec-red-lo: #9E2316;     /* 红接线柱的亮面、暗面，中间色是 --term-pos */
}
.bd-elec-letter { font-family: var(--font-math); font-weight: 400; }   /* 电路图符号圆圈里的 A、V、M，按教材用衬线字 */

/* 化学·实验室器材 */
:root { --relab-flame-core: #E5392B; --relab-flame-core-line: #A8261C; }   /* 酒精灯焰心，照教材画成红色 */

/* 力学器材（mech）：天平底座、停表红色内圈数字、测力计外壳、小车车厢的材质色 */
:root {
  --mech-base: #C7D4CB;     /* 托盘天平的浅灰绿铸铁底座 */
  --mech-red: #D0312D;      /* 停表内圈数字和小表盘刻度 */
  --mech-case: #3F8C99;     /* 弹簧测力计的青色塑料外壳 */
  --mech-paint: #8FB2C9;    /* 小车车厢的蓝灰漆 */
  --mech-num-sm: 22px;      /* 停表红字和小表盘数字 */
}
.bd-mech-base { fill: var(--mech-base); stroke: var(--ink); stroke-width: var(--outline); stroke-linejoin: round; }
.bd-mech-case { fill: var(--mech-case); stroke: var(--ink); stroke-width: var(--outline); stroke-linejoin: round; }
.bd-mech-paint { fill: var(--mech-paint); stroke: var(--ink); stroke-width: var(--outline); stroke-linejoin: round; }
.bd-mech-scale-dark { stroke: var(--surface); }   /* 深色标尺上的白色刻度线 */
.bd-mech-scale-red { stroke: var(--mech-red); }
.bd-label.bd-tick.bd-mech-num { font-weight: 700; font-size: var(--size-l3); fill: var(--ink); }   /* 停表表盘的粗黑数字 */
.bd-label.bd-tick.bd-mech-num-sm { font-size: var(--mech-num-sm); stroke-width: 4px; }   /* 停表红字和小表盘数字，约为黑字的 0.7 */
.bd-label.bd-mech-red { fill: var(--mech-red); }
.bd-mech-coil-back { fill: none; stroke: var(--metal-line); stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; }   /* 弹簧背面半圈 */

/* 光学·实验器材（optics.js：candle、holder、lightScreen、opticalBench、lens） */
:root {
  --roa-wax-hi: #FBC3CC; --roa-wax: #F08797; --roa-wax-lo: #CF5871; --roa-wax-top: #F9B0BD;   /* 粉红蜡烛：亮面、本色、暗面、顶面 */
}

/* 生物·动物（bio-animal.js）：鸡卵、昆虫、家鸽的飞行结构、遗传图解、米勒实验装置。结构平涂，外轮廓墨线 */
:root {
  --an-shell: #EFB57E; --an-shell-in: #F8DEC2;--an-membrane: #F7FAFC; --an-air: #DCEAF4; --an-air-hole: #B7CEE2;   /* 鸡卵：卵壳浅褐、卵壳膜白、气室里的空气淡蓝（敲开后看进去的空腔深一些） */
  --an-albumen: #FBF3C8; --an-yolk: #F5A524; --an-vm: #FFE3A3;     /* 卵白淡黄（透明）、卵黄橙黄、卵黄膜 */
  --an-disc: #FFFBF0; --an-chalaza: #FFFDF4; --an-chalaza-line: #D9CBA0;   /* 胚盘乳白、系带 */
  --an-mouth: #6B2B2B;                                             /* 张开的嘴里的暗面 */
  --an-locust: #94C155; --an-locust-lo: #6E9C38; --an-locust-line: #557F28;   /* 蝗虫：身体绿、远侧的足和口器深绿、体节线 */
  --an-wing: #C4C27A; --an-wing-line: #8E8A48; --an-eye: #8A5A2B; --an-ocellus: #E8CB72;   /* 蝗虫的前翅（革质，黄绿）、翅脉、复眼褐色、单眼浅黄 */
  --an-bee: #2F2A25; --an-bee-band: #D8CFBD; --an-bee-eye: #6B5A48;          /* 蜂：黑色、腹部后半节间的浅色窄带、复眼 */
  --an-bee-wing: rgba(214, 226, 236, 0.72); --an-bee-vein: #7D8C9C;          /* 蜂的翅：透明膜质、翅脉 */
  --an-silk-egg: #CFC8BA; --an-silkworm: #F6F3EA; --an-silk-line: #C8BFA8; --an-silk-head: #E2D8C2;   /* 家蚕：卵、幼虫、体节线、头 */
  --an-cocoon: #FDFBF5; --an-cocoon-in: #EEE6D4; --an-pupa: #C8792F; --an-pupa-line: #8E5016;       /* 茧、茧里的暗面、蛹、蛹的环纹 */
  --an-moth: #FAF7F0; --an-pod: #C9A57E; --an-locust-egg: #F1CE5C;                                 /* 蚕蛾、蝗虫的卵囊和卵 */
  --an-bird-ghost: #EEF2F7; --an-beak: #4A4440; --an-pectoral-line: #8F3E30;   /* 鸟：骨骼层的身体轮廓、喙、胸肌的肌纤维 */
  --an-gas: #F7F09A; --an-tube: #EEF5FB; --an-jacket: #C9D6E2;    /* 米勒装置：容器里的混合气体淡黄、玻璃管、冷凝器夹套 */
}

/* 昆虫：蝗虫平涂绿色，远侧的足深一些；前翅革质黄绿带纵脉；蜂黑色、腹部后半节间有窄的浅色带，翅透明。
   insect() 在外层组上写 --an-k = 1 / scale，缩小嵌进别的图里时外轮廓仍是 3、内部线仍是 2 */
.bd-an-locust { fill: var(--an-locust); stroke: var(--ink); stroke-width: calc(var(--outline) * var(--an-k, 1)); stroke-linejoin: round; }

/* 化学·实验装置（chem-lab.js）：橡胶塞、导管、胶皮管、水槽、试管夹、坩埚钳、木条 */
:root {
  --chemlab-stopper: #DCC67E; --chemlab-stopper-hi: #F3E8B8; --chemlab-stopper-lo: #B49B4F;   /* 橡胶塞：教材画成土黄色 */
  --chemlab-hose: #7E858E; --chemlab-hose-hi: #B3B9C0;   /* 胶皮管：灰色 */
  --chemlab-water: #CFEAF9; --chemlab-water-line: #7DBDE6;   /* 水槽和集气瓶里的水：同一种浅蓝平涂 */
  --chemlab-milky: #E6E9EC;    /* 变浑浊的石灰水 */
  --chemlab-kmno4: #4A2F5E;    /* 高锰酸钾：紫黑色固体 */
  --chemlab-marble: #EEEAE0; --chemlab-zinc: #B4BBC3;   /* 大理石块、锌粒 */

/* 物理·电磁（instruments/magnet.js）：磁体 N 极红、S 极蓝；磁感线和受力箭头用焦点色，螺线管上的电流方向用墨色小箭头；纸筒、漆包线按真实颜色 */

:root {

.bd-atmos-polar { fill: var(--atmos-polar); } .bd-atmos-west { fill: var(--atmos-west); } .bd-atmos-trade { fill: var(--atmos-trade); } .bd-atmos-strip { fill: var(--atmos-strip); }

:root { --atmos-warm-air: #FCE6CC; --atmos-cold-air: #CFE3F5; --atmos-cold-move: #11898A; --atmos-warm-move: #E8642C; --atmos-cold-front: #7B4FC2; --atmos-warm-front: #E0412B; }

<script>/* 白板互动教学设计系统 · 画布与排版脚本。由 scripts/inline.py 拼进页面。
 * fitCanvas：画布适配和全屏按钮；fmt / fmtUnit：数值格式；tex：公式排版；chem / chemText：化学式排版；icon：引用 icons.svg 里的图标。 */

function cssPx(name, fallback) {
  var v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
  return isNaN(v) ? fallback : v;
}

// 画布高 --canvas-h，宽在 --canvas-w-min 到 --canvas-w-max 间随视口比例伸缩，再整体缩放进视口。
// 宽度变化时调用 onWidth(cw)，页面在这里重绘。标题行最右自动加全屏按钮。
function fitCanvas(viewport, canvas, onWidth) {
  var H = cssPx('--canvas-h', 1080), W_MIN = cssPx('--canvas-w-min', 1440), W_MAX = cssPx('--canvas-w-max', 1920), last = 0;
  addFullscreen(canvas);
  function fit() {
    var w = viewport.clientWidth, h = viewport.clientHeight;
    if (!w || !h) return;
    var cw = Math.round(Math.max(W_MIN, Math.min(W_MAX, H * w / h)));
    var s = Math.min(w / cw, h / H);
    canvas.style.width = cw + 'px';
    canvas.style.transform = 'translate(' + (w - cw * s) / 2 + 'px,' + (h - H * s) / 2 + 'px) scale(' + s + ')';
    if (cw === last) return;
    last = cw;
    compact();
    if (onWidth) onWidth(cw);
  }
  // 标题行放不下时隐藏操作提示（按步推进时改为隐藏标题）。宽度变了、读数或那一句变了都重新判断
  var bar = canvas.querySelector('.bd-titlebar');
  function compact() {
    if (!bar) return;
    bar.classList.remove('bd-compact');
    if (bar.scrollWidth > bar.clientWidth) bar.classList.add('bd-compact');
  }
  if (bar && window.MutationObserver) new MutationObserver(compact).observe(bar, { childList: true, characterData: true, subtree: true });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(viewport);
  window.addEventListener('resize', fit);
  fit();
  return fit;
}

// 全屏：标题行最右一个图标按钮，F 键同效，不计入控件数。浏览器不允许全屏时（如 iframe 没有 allowfullscreen）不放。
function addFullscreen(canvas) {
  var doc = document, root = doc.documentElement;
  var bar = canvas.querySelector('.bd-titlebar');
  if (!bar || bar.querySelector('.bd-fullscreen') || !(doc.fullscreenEnabled || doc.webkitFullscreenEnabled)) return;
  var b = doc.createElement('button');
  b.type = 'button';
  b.className = 'bd-btn bd-btn-icon bd-fullscreen';
  function on() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
  function label() {
    b.innerHTML = icon(on() ? 'fullscreen-exit' : 'fullscreen');
    b.setAttribute('aria-label', on() ? '退出全屏' : '全屏');
  }
  function toggle() {
    if (on()) (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  }
  b.addEventListener('click', toggle);
  doc.addEventListener('fullscreenchange', label);
  doc.addEventListener('webkitfullscreenchange', label);
  doc.addEventListener('keydown', function (e) {
    if ((e.key === 'f' || e.key === 'F') && !/^(input|textarea|select)$/i.test(e.target.tagName || '')) toggle();
  });
  label();
  bar.appendChild(b);
}

// 固定小数位；负号用 U+2212
function fmt(value, digits) {
  var s = Number(value).toFixed(digits || 0);
  if (Number(s) === 0) s = (0).toFixed(digits || 0);
  return s.replace('-', '−');
}

// 数值加单位：°、′、″、% 前不空格
function fmtUnit(value, digits, unit) {
  var s = fmt(value, digits);
  return unit ? s + (/^[°′″%]/.test(unit) ? '' : ' ') + unit : s;
}

// 混排文字转 HTML：$…$ 内按公式排版（字母斜体；数字、运算符、函数名、π 正体），其余原样。
// 公式内支持 _x 下标、^x 上标、\frac{分子}{分母}；- * ' <= >= != 自动换成 − × ′ ≤ ≥ ≠。
var TEX_FUNCS = /^(sin|cos|tan|cot|lg|ln|log|lim|max|min)/;

function texEscape(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });

function texMath(src) {

  while (i < src.length) {
    var rest = src.slice(i), c = src[i], m;
    if ((m = TEX_FUNCS.exec(rest))) { out += '<span class="bd-math">' + m[1] + '</span>'; i += m[1].length; continue; }
    if (rest.indexOf('\\frac{') === 0) {

      out += '<span class="bd-frac"><span>' + texMath(src.slice(i + 6, j1)) + '</span><span>' + texMath(src.slice(j1 + 2, j2)) + '</span></span>';
      i = j2 + 1;
      continue;
    }
    if (c === '_' || c === '^') {
      var tag = c === '_' ? 'sub' : 'sup', t;
      i++;
      if (src[i] === '{') { var j = src.indexOf('}', i); t = src.slice(i + 1, j); i = j + 1; } else { t = src[i]; i++; }
      out += '<' + tag + ' class="bd-' + tag + (/^[A-Za-z]$/.test(t) ? ' bd-italic' : '') + '">' + texMath(t).replace(/<[^>]+>/g, '') + '</' + tag + '>';
      continue;
    }
    var swap = TEX_SWAPS[rest.slice(0, 2)] ? rest.slice(0, 2) : TEX_SWAPS[c] ? c : null;
    if (swap) { out += '<span class="bd-math">' + TEX_SWAPS[swap] + '</span>'; i += swap.length; continue; }
    out += /[A-Za-zΑ-Ωα-ω]/.test(c) && c !== 'π'
      ? '<span class="bd-var">' + c + '</span>'
      : '<span class="bd-math">' + texEscape(c) + '</span>';
    i++;

  return out;
}
function tex(src) {
  return String(src).split('$').map(function (seg, n) { return n % 2 ? texMath(seg) : texEscape(seg); }).join('');
}

// 化学式和化学方程式：chem('2H2O')、chem('O2-')、chem('4P + 5O2 ={点燃} 2P2O5')。tex() 把字母排成斜体，不能用来写化学式。
// 元素符号和系数正体；元素或右括号后的数字下标；末尾的正负号是电荷，上标成「2−」，1 省略。电荷前的数字这样分：
// 单个元素时是电荷（O2- → O²⁻，Mg2+ → Mg²⁺）；原子团时末位是电荷、其余是下标（SO42- → SO₄²⁻，NH4+ → NH₄⁺，NO3- → NO₃⁻）。也可用 ^ 写明：'SO4^2-'。
// 词之间用空格：'+' 是加号，'=' 或 '={条件}' 是等号（条件写在等号上方，可含化学式，如 ={MnO2}），'↑' '↓' 原样；汉字等其他词原样。
// chem() 返回 HTML 字符串（已转义，<strong> 在外面拼）；SVG 里用 chemText(parent, x, y, src, attrs)，返回 <g>。
function chemParts(src) {
  var out = [];
  String(src).split(/(\s+)/).forEach(function (w) {
    if (!w) return;
    if (/^\s+$/.test(w)) { out.push({ t: 'space' }); return; }
    var eq = /^(?:=+|→|->)(?:\{([^}]*)\})?$/.exec(w);
    if (eq) { out.push({ t: 'eq', s: eq[1] || '' }); return; }
    if (w === '+' || w === '↑' || w === '↓') { out.push({ t: 'op', s: w }); return; }
    var m = /^(\d*)([A-Z(\[].*?)([↑↓]?)$/.exec(w), body, mag = '', sign = '';
    if (m) {
      body = m[2];
      var c = /^(.*?)\^(\d*)([+\-−])$/.exec(body) || /^(.*?)(\d*)([+\-−])$/.exec(body);
      if (c) {
        body = c[1]; sign = c[3]; mag = c[2];
        if (body.indexOf('^') < 0 && !/\^/.test(m[2]) && !/^[A-Z][a-z]?$/.test(body)) {   // 原子团：末位是电荷，其余是下标
          if (mag.length > 1) { body += mag.slice(0, -1); mag = mag.slice(-1); } else { body += mag; mag = ''; }
        }
      }
    }
    if (!m || !/^(?:[A-Z][a-z]?|[()\[\]·]|\d+)+$/.test(body)) { out.push({ t: 'text', s: w }); return; }
    if (m[1]) out.push({ t: 'el', s: m[1] });
    var prev = '';

    var dx = e[0] - o[0], dy = e[1] - o[1], len = Math.hypot(dx, dy) || 1;
    var ang = Math.acos(Math.max(-1, Math.min(1, (dx * normal[0] + dy * normal[1]) / len))) * 180 / Math.PI;
    if (ang < snap) { e = [o[0] + normal[0] * len, o[1] + normal[1] * len]; ang = 0; }
    var cr = normal[0] * dy - normal[1] * dx;
    return { from: o, to: e, angle: Math.round(ang), side: Math.round(ang) === 0 || Math.round(ang) === 180 ? 0 : cr > 0 ? 1 : -1, onPoint: o === from };
  }
  hit.addEventListener('pointerdown', function (e) {
    e.stopPropagation();   // 不让 zoomable 当成平移
    e.preventDefault();
    start = svgPoint(svg, e);
    try { hit.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有真实指针 */ }
  });
  hit.addEventListener('pointermove', function (e) {
    if (start && opts.onMove) opts.onMove(measure(svgPoint(svg, e)));
  });
  function up(e) {
    if (!start) return;
    var r = measure(svgPoint(svg, e));
    start = null;
    if (opts.onDone) opts.onDone(Math.hypot(r.to[0] - r.from[0], r.to[1] - r.from[1]) >= 60 ? r : null);
  }
  hit.addEventListener('pointerup', up);
  hit.addEventListener('pointercancel', up);
  return {
    at: function (f, n) { from = f; normal = n; },
    on: function (flag) { hit.style.display = flag ? '' : 'none'; },
  };
}

// 互斥切换：seg 是 .bd-seg，按钮带 aria-checked。select(i) 更新按钮状态并调用 onChange(i)。
// 场景切换、实物 / 光路模式、遮挡开关都用它；每个场景的参数由页面的 state 保存。
function toggles(seg, onChange) {
  var buttons = [].slice.call(seg.querySelectorAll('button'));
  function select(i) {
    buttons.forEach(function (b, k) { b.setAttribute('aria-checked', k === i ? 'true' : 'false'); });
    onChange(i);
  }
  buttons.forEach(function (b, i) { b.addEventListener('click', function () { select(i); }); });
  onReset(function () { buttons.forEach(function (b, k) { b.setAttribute('aria-checked', k === 0 ? 'true' : 'false'); }); });
  return select;
}

// 讲解分步：root 是 .bd-mask（侧停加 bd-mask-side），里面有 .bd-panel、.bd-panel-progress、.bd-panel-body、.bd-panel-foot。
// items = [{ title, html }]，html 里可用 tex()。opener 是「讲解」按钮，open / close 同步它的 aria-pressed。
// onStep(i) 在每次切步时调用，页面用它给图形做焦点切换或淡出；onStep(-1) 表示已收起。
function panel(root, opener, items, onStep) {
  var progress = root.querySelector('.bd-panel-progress');
  var body = root.querySelector('.bd-panel-body');
  var foot = root.querySelector('.bd-panel-foot');
  var head = root.querySelector('.bd-panel-title'), headText = head && head.innerHTML;   // 有步骤标题时顶部只显示步骤标题
  var stepLabel = document.createElement('span');
  stepLabel.className = 'bd-panel-step';
  var marks = items.map(function (_, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'bd-panel-mark';
    b.setAttribute('aria-label', '第 ' + (i + 1) + ' 步');
    b.appendChild(document.createElement('span'));
    b.addEventListener('click', function () { go(i); });
    progress.appendChild(b);
    return b;
  });
  progress.appendChild(stepLabel);
  var prev = document.createElement('button'), next = document.createElement('button');
  prev.type = next.type = 'button';
  prev.className = 'bd-btn bd-btn-icon';   // 上一步只放图标，让「下一步」成为面板底部唯一的文字按钮
  next.className = 'bd-btn';
  prev.innerHTML = icon('prev');
  prev.setAttribute('aria-label', '上一步');
  next.innerHTML = '<span>下一步</span>' + icon('next');
  prev.addEventListener('click', function () { go(current - 1); });
  next.addEventListener('click', function () { go(current + 1); });
  foot.appendChild(prev);
  foot.appendChild(next);
  var closeBtn = root.querySelector('[data-close]');
  if (closeBtn) {
    closeBtn.innerHTML = icon('close');
    closeBtn.setAttribute('aria-label', '收起');
    closeBtn.addEventListener('click', close);
  }
  var current = 0;
  function go(i, silent) {
    current = Math.max(0, Math.min(items.length - 1, i));
    marks.forEach(function (m, k) { m.className = 'bd-panel-mark' + (k < current ? ' bd-done' : k === current ? ' bd-current' : ''); });
    stepLabel.textContent = (current + 1) + ' / ' + items.length;
    var t = items[current].title ? tex(items[current].title) : '';
    if (head) head.innerHTML = t || headText;
    body.innerHTML = (t && !head ? '<h3 class="bd-panel-subtitle">' + t + '</h3>' : '') + items[current].html;
    prev.disabled = current === 0;
    next.disabled = current === items.length - 1;
    if (onStep && !silent) onStep(current);
  }
  function open(i) {
    PEN.panel = api;
    root.hidden = false;
    opener.setAttribute('aria-pressed', 'true');
    go(i == null ? current : i);
  }
  function close() {
    root.hidden = true;
    opener.setAttribute('aria-pressed', 'false');
    if (onStep) onStep(-1);
  }
  opener.addEventListener('click', function () { root.hidden ? open() : close(); });
  root.hidden = true;
  go(0, true);
  var api = { open: open, close: close, go: go, step: function () { return root.hidden ? -1 : current; }, reset: function () { go(0, true); close(); } };
  if (!PEN.panel) PEN.panel = api;
  bindPen();
  onReset(api.reset);
  return api;
}

// 按步推进：互动课件分步时用，不开讲解面板。prev、next 是控件行的上一步 / 下一步按钮，hint 是标题行的操作提示 .bd-hint。
// items = [{ hint }]，hint 是这一步的一句话，前面自动加「2 / 5」；onStep(i) 在每次切步时调用，页面在里面改 state 并重绘。
// 翻页笔的上一步 / 下一步接到这里。返回 { go(i), step(), set(items), reset }；set 换一套步骤（切换模式时）并回到第 1 步。
function stepper(prev, next, hint, items, onStep) {
  var current = 0;
  prev.innerHTML = icon('prev');
  prev.setAttribute('aria-label', '上一步');
  next.innerHTML = '<span>下一步</span>' + icon('next');
  hint.classList.add('bd-hint-step');
  function go(i, silent) {
    var j = Math.max(0, Math.min(items.length - 1, i));
    if (j !== i && j === current) return;   // 已在第一步或最后一步，翻页笔再按不重画
    current = j;
    hint.innerHTML = '<span class="bd-step-count">' + (current + 1) + ' / ' + items.length + '</span>' + tex(items[current].hint || '');
    prev.disabled = current === 0;
    next.disabled = current === items.length - 1;
    if (onStep && !silent) onStep(current);
  }
  prev.addEventListener('click', function () { go(current - 1); });
  next.addEventListener('click', function () { go(current + 1); });
  go(0, true);
  function set(list) { items = list; current = 0; go(0); }
  var api = { go: go, step: function () { return current; }, set: set, open: function () {}, close: function () {}, reset: function () { go(0, true); } };
  if (!PEN.panel) PEN.panel = api;
  bindPen();
  onReset(api.reset);
  return api;
}

// 教师点按 keep 以外的任何位置时调用 stop：自动演示一碰就停，把画面交还给教师。
function stopOnTouch(keep, stop) {
  document.addEventListener('pointerdown', function (e) { if (!keep.contains(e.target)) stop(); }, true);
}

// 选择题：在 container 里生成题干、两列选项和反馈。q = { question, options: ['...'], answer: 1, right: '理由', wrong: '理由' }。
// 选项文字可用 tex()。返回 { reset }。
function choice(container, q) {
  container.innerHTML = '<p class="bd-choice-question">' + tex(q.question) + '</p><div class="bd-choice-options"></div><p class="bd-choice-feedback" hidden></p>';
  var options = container.querySelector('.bd-choice-options');
  var feedback = container.querySelector('.bd-choice-feedback');
  var buttons = q.options.map(function (text, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'bd-btn bd-choice-option';
    b.innerHTML = '<span class="bd-choice-key">' + 'ABCD'.charAt(i) + '</span><span>' + tex(text) + '</span>';
    b.addEventListener('click', function () { answer(i); });
    options.appendChild(b);
    return b;
  });
  function answer(i) {
    var ok = i === q.answer;
    buttons.forEach(function (b, k) { b.classList.toggle('bd-chosen-correct', ok && k === i); b.classList.toggle('bd-chosen-wrong', !ok && k === i); });
    feedback.className = 'bd-choice-feedback ' + (ok ? 'bd-correct' : 'bd-wrong');
    feedback.innerHTML = icon(ok ? 'correct' : 'wrong') + '<span>' + (ok ? '回答正确：' + tex(q.right) : '再想想：' + tex(q.wrong)) + '</span>';
    feedback.hidden = false;
  }
  function reset() {
    buttons.forEach(function (b) { b.classList.remove('bd-chosen-correct', 'bd-chosen-wrong'); });
    feedback.hidden = true;
  }
  return { reset: reset };
}

// 播放控制：button 是「播放 / 暂停」按钮，slider 是时间滑块（min、max、step 由页面定）。
// onTime(t) 每帧收到当前时间，页面用它更新 state 并重绘。speed 是每秒推进的滑块单位。时间记在组件里，播放时 t 连续变化，
// 不受滑块 step 限制（滑块只显示位置）；要离散值时在 onTime 里取整。
// 播到终点自动暂停；点按「播放」以外的任何位置时暂停。返回 { play, pause, toggle, reset }。
function playback(button, slider, onTime, speed) {
  var playing = false, last = 0, raf = 0, t = Number(slider.value), shown = t;   // shown：上次写进滑块后滑块显示的值
  function label() {
    button.innerHTML = icon(playing ? 'pause' : 'play') + '<span>' + (playing ? '暂停' : '播放') + '</span>';
    button.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function frame(now) {
    if (!playing) return;
    t += ((now - last) / 1000) * speed;
    last = now;
    if (t >= Number(slider.max)) { t = Number(slider.max); playing = false; label(); }
    slider.value = t;
    shown = Number(slider.value);
    onTime(t);
    if (playing) raf = requestAnimationFrame(frame);
  }
  function play() {
    if (Number(slider.value) !== shown) t = Number(slider.value);   // 页面改过滑块，从滑块的位置接着播
    if (t >= Number(slider.max)) { t = Number(slider.min); slider.value = t; }
    shown = Number(slider.value);
    playing = true;
    label();
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(raf);
    label();
  }
  function toggle() { playing ? pause() : play(); }
  button.addEventListener('click', toggle);
  slider.addEventListener('input', function () { pause(); t = Number(slider.value); onTime(t); });
  stopOnTouch(button, function () { if (playing) pause(); });
  label();
  var api = { play: play, pause: pause, toggle: toggle, reset: function () { pause(); slider.value = slider.min; t = Number(slider.value); onTime(t); } };
  if (!PEN.player) PEN.player = api;
  bindPen();
  onReset(api.reset);
  return api;
}

// 方向组：逐格平移或固定角度旋转时用，整组算一组控件。container 是 .bd-dpad。
// actions = [{ name: 'left', label: '←' }, ...]，onAction(name) 由页面改 state 并重绘。按钮文字可用 icon()。
function dpad(container, actions, onAction) {
  actions.forEach(function (a) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'bd-btn';
    b.innerHTML = a.label;
    b.setAttribute('aria-label', a.title || a.label.replace(/<[^>]+>/g, '') || a.name);
    b.addEventListener('click', function () { onAction(a.name); });
    container.appendChild(b);
  });
}

// 对象工具条：只对一个对象有意义的动作（旋转、锁定、翻转）放在它旁边，老师的手不用离开对象。
// stage 是 .bd-stage，svg 是图形；actions = [{ name, label, toggle }]，toggle 为 true 的按钮用 aria-pressed 记状态。
// show(handle) 把工具条贴在拖动点上方；点别处或开始拖动时自动收起。工具条跟着对象算，不计入控件数。
function toolbar(stage, svg, actions, onAction) {
  var el = document.createElement('div');
  el.className = 'bd-tool';
  el.hidden = true;
  var buttons = actions.map(function (a) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'bd-btn';
    b.innerHTML = a.label;
    if (a.toggle) b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      if (a.toggle) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      onAction(a.name, a.toggle ? b.getAttribute('aria-pressed') === 'true' : undefined);
    });
    el.appendChild(b);
    return b;
  });
  stage.appendChild(el);
  var current = null;
  function place() {
    if (!current) return;
    // 拖动点的屏幕位置换算成实验区的设计坐标：整页 scale 用实验区的实际宽度和布局宽度之比得到
    var m = current.getScreenCTM(), r = stage.getBoundingClientRect(), s = r.width / stage.offsetWidth;
    var x = (m.e - r.left) / s, y = (m.f - r.top) / s;
    el.style.left = Math.max(16, Math.min(stage.offsetWidth - el.offsetWidth - 16, x - el.offsetWidth / 2)) + 'px';
    el.style.top = Math.max(16, y - 104 - el.offsetHeight) + 'px'; // 让出对象上方的标签
  }
  function show(handle) { current = handle; el.hidden = false; place(); }
  function hide() { current = null; el.hidden = true; }
  document.addEventListener('pointerdown', function (e) { if (!el.contains(e.target) && !(current && current.contains(e.target))) hide(); });
  onReset(function () { hide(); buttons.forEach(function (b, k) { if (actions[k].toggle) b.setAttribute('aria-pressed', 'false'); }); });
  return { show: show, hide: hide, place: place, set: function (name, on) { buttons[actions.findIndex(function (a) { return a.name === name; })].setAttribute('aria-pressed', on ? 'true' : 'false'); } };
}

// 键盘：map = { next, prev, space, escape }，值是函数。panel 和 playback 已经通过它接了翻页笔，页面一般不用再调。
function keys(map) {
  // 挂在 window 上，排在页面挂在 document 和元素上的处理函数之后
  window.addEventListener('keydown', function (e) {
    if (e.defaultPrevented) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    var fn = { ArrowRight: map.next, PageDown: map.next, ArrowLeft: map.prev, PageUp: map.prev, ' ': map.space, Escape: map.escape }[e.key];
    if (fn) { fn(); e.preventDefault(); }
  });
}

// 实验区放大：双指捏合、触控板捏合或滚轮放大（最多 opts.max 倍，默认 4），放大后单指拖空白处平移。
// 只缩放实验区里直接放的 svg 和 canvas，标题行、读数、讲解、工具条和控件行不动；拖动点照常准确（换算走 getScreenCTM）。
// 放大时实验区右下角出现「150% 缩回」按钮，点它回到 100%，不计入控件数。stage 是 .bd-stage。返回 { reset, scale }，重置时自动复位。
// 3D 页面的滚轮和拖动已用于转动视角，不用它。canvas 放大后会发虚，要放大看的细节用 SVG 画。
function zoomable(stage, opts) {
  var max = (opts && opts.max) || 4, k = 1, tx = 0, ty = 0, pts = {}, freeW = 0;
  var layers = [].slice.call(stage.children).filter(function (el) { return /^(svg|canvas)$/i.test(el.tagName); });
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'bd-btn bd-zoom-reset';
  btn.hidden = true;
  btn.addEventListener('click', reset);
  stage.appendChild(btn);
  function local(e) {   // 指针位置换算成实验区的设计坐标（整页缩放已扣除）
    var r = stage.getBoundingClientRect(), s = r.width / stage.offsetWidth;
    return [(e.clientX - r.left) / s, (e.clientY - r.top) / s];
  }
  function apply() {
    var W = stage.offsetWidth, H = stage.offsetHeight;
    k = Math.max(1, Math.min(max, k));
    tx = Math.min(0, Math.max((freeW || W) - W * k, tx));   // 放大后的画面始终盖满实验区（to() 时只要盖满讲解左边），不露出空白
    ty = Math.min(0, Math.max(H - H * k, ty));
    layers.forEach(function (el) {
      el.style.transformOrigin = '0 0';
      el.style.transform = k === 1 ? '' : 'translate(' + tx + 'px, ' + ty + 'px) scale(' + k + ')';
    });
    stage.classList.toggle('bd-zoomed', k > 1);
    btn.hidden = k === 1;
    btn.innerHTML = '<span>' + Math.round(k * 100) + '%</span><span>缩回</span>';   // 不用「还原」「重置」，免得和全局重置混淆
  }
  function zoomAt(p, nk) {   // 以 p 为中心缩放，p 下面的内容不动
    nk = Math.max(1, Math.min(max, nk));
    tx = p[0] - (p[0] - tx) * nk / k;
    ty = p[1] - (p[1] - ty) * nk / k;
    k = nk;
    apply();
  }
  function reset() { k = 1; tx = ty = 0; freeW = 0; apply(); }
  // 局部放大：把实验区设计坐标 (x, y) 放大 nk 倍（默认 2），平滑移到讲解左边可见区域的中央。热点 → 放大到该处 → 讲解这一句。
  function to(x, y, nk) {
    var W = stage.offsetWidth, H = stage.offsetHeight, side = stage.querySelector('.bd-mask-side:not([hidden])');
    var r = stage.getBoundingClientRect(), s = r.width / W || 1;
    freeW = side ? Math.max(W / 3, Math.min(W, (side.getBoundingClientRect().left - r.left) / s)) : 0;
    k = Math.max(1, Math.min(max, nk || 2));
    tx = (freeW || W) / 2 - x * k;
    ty = H / 2 - y * k;
    layers.forEach(function (el) { el.style.transition = 'transform 0.6s ease'; });
    apply();
    setTimeout(function () { layers.forEach(function (el) { el.style.transition = ''; }); }, 650);
  }
  onReset(reset);
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomAt(local(e), k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)));   // 触控板捏合发的是带 ctrlKey 的 wheel
  }, { passive: false });
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.bd-handle, .bd-pin, button, input, label, .bd-mask, .bd-tool, .bd-readings, .bd-note')) return;
    if (e.isPrimary) pts = {};   // 没捕获时手指在实验区外抬起收不到 pointerup，新一次按下先清掉旧点
    pts[e.pointerId] = local(e);
  });
  stage.addEventListener('pointermove', function (e) {
    var q = pts[e.pointerId];
    if (!q) return;
    var p = local(e), ids = Object.keys(pts);
    // 真的开始平移或捏合时才捕获指针：只点一下时 click 照常落到图里的对象上（结构图点结构）
    if ((ids.length === 2 || k > 1) && !stage.hasPointerCapture(e.pointerId)) {
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有真实指针 */ }
    }
    if (ids.length === 2) {   // 捏合：按两指距离缩放，按两指中点平移
      var o = pts[ids[0] == e.pointerId ? ids[1] : ids[0]];
      var d0 = Math.hypot(q[0] - o[0], q[1] - o[1]), d1 = Math.hypot(p[0] - o[0], p[1] - o[1]);
      tx += (p[0] - q[0]) / 2;
      ty += (p[1] - q[1]) / 2;
      if (d0 > 0) zoomAt([(p[0] + o[0]) / 2, (p[1] + o[1]) / 2], k * d1 / d0); else apply();
    } else if (k > 1) {
      tx += p[0] - q[0];
      ty += p[1] - q[1];
      apply();
    }
    pts[e.pointerId] = p;
  });
  function up(e) { delete pts[e.pointerId]; }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  return { reset: reset, to: to, scale: function () { return k; } };
}

// 两种状态对比：同一范围画两张图（冬至日 / 夏至日、吸气 / 呼气）。mode 'swipe' 拖竖直分割线，左边是 A、右边是 B；
// 'fade' 拖实验区顶边的小滑块，B 从透明渐变到完全盖住 A。stage 是 .bd-stage，组件在里面加一层自己的 svg。
// drawA(g, svg)、drawB(g, svg) 往 g 里画，开头照常调 fit(svg, 范围)，两张图用同一个范围，位置才对得上。
// opts = { mode: 'swipe' | 'fade', labels: ['冬至日', '夏至日'], value（初值：swipe 是分割线位置 0…1，默认 0.5；fade 是 B 的不透明度，默认 0）}。
// 返回 { el（这层 svg）, draw()（状态变了、实验区尺寸变了时重画两张图）, set(v), value(), show(on)（和单张图切换时用）}。
// 分割线和小滑块在图里，不计入控件数；重置时回到初值。
function compare(stage, drawA, drawB, opts) {
  opts = opts || {};
  var mode = opts.mode === 'fade' ? 'fade' : 'swipe', init = opts.value != null ? +opts.value : mode === 'swipe' ? 0.5 : 0, v = init;
  var labels = opts.labels || ['A', 'B'], W = 0, H = 0, TRACK = 200;
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'bd-compare-layer');

}

/* 画器材的公用函数，instruments/ 里的文件都依赖它们。 */

// 图上热点标签：点在 (x, y)，标签框在点上方，opts.below 放到下方，opts.current 标成当前热点。
// 返回的 g 由页面加点击事件；画在实验区的 SVG 里，放大时跟着图片走。
function pin(parent, x, y, text, opts) {
  opts = opts || {};
  var d = opts.below ? 1 : -1, H = 56, STEM = 24;
  var g = svgEl(parent, 'g', { transform: 'translate(' + x + ',' + y + ')' }, 'bd-pin' + (opts.current ? ' bd-pin-current' : ''));
  svgEl(g, 'line', { x1: 0, y1: 0, x2: 0, y2: STEM * d }, 'bd-pin-stem');
  svgEl(g, 'circle', { r: 8 }, 'bd-pin-dot');
  var box = svgEl(g, 'rect', { rx: 8, y: d < 0 ? -STEM - H : STEM, height: H }, 'bd-pin-box');
  var t = svgEl(g, 'text', { y: d < 0 ? -STEM - H / 2 : STEM + H / 2, 'text-anchor': 'middle' }, 'bd-pin-text', text);
  var w = 0;
  try { w = t.getComputedTextLength(); } catch (err) { /* 未渲染时按字数估 */ }
  if (!w) w = 32 * String(text).length;
  box.setAttribute('x', -w / 2 - 16);
  box.setAttribute('width', w + 32);
  return g;
}
// 一行文字分段排：parts 是 [{ role, text }]，每段按作用取样式，不把名称、数值、单位拼成一个字符串。
// role：value 数值、name 名称、unit 单位、label 标签、heading 分组标题。attrs 可加 text-anchor。
var TEXT_ROLES = { value: 'bd-value', name: 'bd-reading-name', unit: 'bd-reading-unit', label: 'bd-label', heading: 'bd-heading' };
function svgText(parent, x, y, parts, attrs) {
  var a = { x: x, y: y };
  for (var k in attrs) a[k] = attrs[k];
  var t = svgEl(parent, 'text', a, 'bd-text');
  parts.forEach(function (p, i) {
    svgEl(t, 'tspan', i ? { dx: p.role === 'unit' ? 8 : 16 } : {}, TEXT_ROLES[p.role], p.text);
  });
  return t;
}
// 对象读数，画在对象图形正下方：名称右对齐到 x，数值、单位和状态从 x 往右排。几行用同一个 x，数值对齐成一列。
// r = { name, value, unit, state, alert, cover, covered }；state 是「已落地」这类短状态，画成带底色的标签，alert 时用临界底色。
// cover 传一个 key（如 'r'）时可以先遮后揭，covered 为真时打开页面就遮住，见 coverable()。
function reading(parent, x, y, r) {
  var g = svgEl(parent, 'g', {}, r.alert ? 'bd-state-alert' : null);
  if (r.name) svgText(g, x - 12, y, [{ role: 'name', text: r.name }], { 'text-anchor': 'end' });
  var parts = [{ role: 'value', text: r.value }];
  if (r.unit) parts.push({ role: 'unit', text: r.unit });
  var t = svgText(g, x + 12, y, parts);
  if (r.state) {
    var sx = x + 12 + textWidth(t, 28 * String(r.value + (r.unit || '')).length) + 24;
    var box = svgEl(g, 'rect', { x: sx, y: y - 40, height: 48, rx: 8 }, 'bd-state-box');
    var s = svgEl(g, 'text', { x: sx + 16, y: y - 16 }, 'bd-state', r.state);
    box.setAttribute('width', textWidth(s, 28 * String(r.state).length) + 32);
  }
  if (r.cover) {   // 遮住时数值透明，盖一块灰底「?」
    var vw = Math.max(44, textWidth(t.firstChild, 28 * String(r.value).length)), cv = svgEl(g, 'g', {}, 'bd-cover');
    svgEl(cv, 'rect', { x: x + 4, y: y - 42, width: vw + 16, height: 56, rx: 8 });
    svgEl(cv, 'text', { x: x + 12 + vw / 2, y: y, 'text-anchor': 'middle' }, 'bd-value', '?');
    coverable(g, r.cover, r.covered);
  }

}
// 读数先遮后揭：老师点一下读数，数值换成「?」，让学生先预测；再点一下揭开。重置时回到打开页面时的样子。
// el 是标题行或实验区右上角的 .bd-reading（页面初始化时调一次），或 reading() 画的组（传 r.cover 时自动调）。
// key 记住遮住状态，每次 draw() 重画的 SVG 读数要给；HTML 读数不重建，可以不给。start 为真时打开页面就遮住（结论、答案）。
var COVERED = {}, COVER_START = [];
function coverable(el, key, start) {
  function set(on) { if (key != null) COVERED[key] = on; el.classList.toggle('bd-covered', on); }
  el.classList.add('bd-coverable');
  if (start && key != null && !(key in COVERED)) COVERED[key] = true;
  if (start && key == null) COVER_START.push(el);
  set(key != null ? !!COVERED[key] : !!start);
  el.addEventListener('click', function () { set(!el.classList.contains('bd-covered')); });
  return el;
}
onReset(function () {
  COVERED = {};
  [].forEach.call(document.querySelectorAll('.bd-covered'), function (el) { el.classList.remove('bd-covered'); });
  COVER_START.forEach(function (el) { el.classList.add('bd-covered'); });
});
function textWidth(t, fallback) {
  var w = 0;
  try { w = t.getComputedTextLength(); } catch (err) { /* 未渲染时用估计值 */ }
  return w || fallback;
}
function svgEl(parent, tag, attrs, cls, text) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var a in attrs) e.setAttribute(a, attrs[a]);
  if (cls) e.setAttribute('class', cls);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function tickText(v) { return String(+v.toFixed(2)); }

/* 语文与英语：发音、朗读、课文阅读。 */

// 本地语音：只取 localService 为真、语种相同的语音，完全匹配（en-US）优先，其次同语种（en-GB）。云端语音断网就没有，不用。
// Chrome 第一次 getVoices() 可能是空数组，要等 voiceschanged；一个语音也没有时它不触发，所以最多等 VOICE_WAIT 毫秒。
// macOS 带一批特效语音（Bells、Bubbles、Zarvox…），名字在 VOICE_PREFER 里的常用自然语音优先。结果按语言缓存。
var VOICE_WAIT = 1500;
var VOICE_PREFER = /Microsoft|Samantha|Alex|Daniel|Karen|Moira|Tingting|Meijia|Sinji|Lili/;
var VOICES = {};
function voiceFor(lang, cb) {
  var synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { cb(null); return; }   // 安卓 WebView 没有语音接口
  if (VOICES[lang] !== undefined) { cb(VOICES[lang]); return; }
  function norm(v) { return String(v.lang).toLowerCase().replace('_', '-'); }
  function rank(v) { return (norm(v) === lang.toLowerCase() ? 0 : 4) + (VOICE_PREFER.test(v.name) ? 0 : 2) + (v.default ? 0 : 1); }
  function pick() {
    var base = lang.toLowerCase().split('-')[0];
    var local = synth.getVoices().filter(function (v) { return v.localService && norm(v).split('-')[0] === base; });
    local.sort(function (a, b) { return rank(a) - rank(b); });
    return (VOICES[lang] = local[0] || null);
  }
  if (synth.getVoices().length) { cb(pick()); return; }
  var timer = setTimeout(done, VOICE_WAIT);
  function done() { clearTimeout(timer); synth.removeEventListener('voiceschanged', done); cb(pick()); }
  synth.addEventListener('voiceschanged', done);
}

// 发音：speak(text, lang) 用本地语音读一句，返回 Promise，读完为 true，没有语音或被打断为 false。lang 如 'en-US'、'zh-CN'。
// 一次读一句；要逐句推进时在 then 里读下一句并移动高亮。不用 boundary 事件逐词高亮，Chrome 上它不按预期触发。
var SPEAKING = null;   // 正在读的句子：留一个引用，Chrome 才不会提前回收它，end 事件才会来
function speak(text, lang, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    voiceFor(lang, function (voice) {
      if (!voice) { resolve(false); return; }
      var synth = window.speechSynthesis, u = new SpeechSynthesisUtterance(text);
      u.voice = voice;
      u.lang = voice.lang;
      u.rate = opts.rate || 0.9;
      u.onend = function () { if (SPEAKING === u) SPEAKING = null; resolve(true); };
      u.onerror = function () { if (SPEAKING === u) SPEAKING = null; resolve(false); };
      synth.cancel();
      SPEAKING = u;
      synth.speak(u);
    });
  });
}
function speakHint(lang) { return { en: '本机没有英语语音', zh: '本机没有中文语音' }[lang.slice(0, 2)] || '本机没有这种语言的语音'; }

// 发音按钮：el 是 HTML 按钮（文字在里面的 <span>）或 SVG 的 <g>（文字是 <text>，底框是 <rect>）。
// text 是字符串，或返回当前单词、当前句子的函数。打开页面就查语音：没有时按钮变灰，文字换成「本机没有英语语音」，点它不出声也不报错。
// 读的时候 aria-pressed 为 true。按钮带 data-speak，检查脚本在无语音环境下点它、查提示。
function speakButton(el, text, lang) {
  var svg = el instanceof SVGElement, label = svg ? el.querySelector('text') : el.querySelector('span') || el;
  el.setAttribute('data-speak', lang);
  el.setAttribute('aria-pressed', 'false');
  el.classList.add('bd-speak');
  voiceFor(lang, function (voice) {
    if (voice) return;
    el.setAttribute('aria-disabled', 'true');
    if (!svg) el.disabled = true;
    label.textContent = speakHint(lang);
    label.classList.add('bd-speak-hint');
    var box = svg && el.querySelector('rect');
    if (box) {   // 换字后按字宽调底框，中心不变
      var w = textWidth(label, 32 * label.textContent.length) + 48, cx = +box.getAttribute('x') + +box.getAttribute('width') / 2;
      box.setAttribute('x', cx - w / 2);
      box.setAttribute('width', w);
    }
  });
  el.addEventListener('click', function () {
    if (el.getAttribute('aria-disabled') === 'true') return;
    el.setAttribute('aria-pressed', 'true');
    speak(typeof text === 'function' ? text() : text, lang).then(function () { el.setAttribute('aria-pressed', 'false'); });
  });

}

// 课文阅读：原文的句子、图上热点、讲解步骤共用一个 id，点哪一处，另两处一起变成当前。
// root 是侧停讲解 .bd-mask，一句一步。sentences = [{ id, text, pin, at, notes, ruby, gloss, title, html }]：
//   text 原文一句；pin 热点上的字，取句中词语（「青树翠蔓」），也是这一步的标题，原文里自动加荧光底；
//   at 热点位置，由 pins() 的 place 换算成 viewBox 坐标；没有 at 或 pin 的句子只在讲解里出现；
//   notes { 字词: 释义 } 排成 .bd-terms；ruby { 字: 拼音 } 注在原文上方；gloss 译文；html 追加在本步末尾（选择题容器等）。
//   没有 text 的一项是普通讲解步（title + html），如小结。
// opts.opener 是「讲解」按钮；opts.lang（'zh-CN'）给了就在面板底部加「朗读」，读当前句；opts.onFocus(s) 当前句变化时调用，收起时 s 为 null；
// 讲解里只显示当前句和前后各一句，前后句可点。返回 { pins(parent, place), open(id), close(), current(), panel }。
function reader(root, sentences, opts) {
  opts = opts || {};
  var cur = -1;
  function mark(s) {
    var html = texEscape(s.text);
    if (s.pin) html = html.replace(texEscape(s.pin), '<strong>' + texEscape(s.pin) + '</strong>');
    for (var w in s.ruby || {}) html = html.split(texEscape(w)).join('<ruby>' + texEscape(w) + '<rt>' + texEscape(s.ruby[w]) + '</rt></ruby>');
    return html;
  }
  function near(i) {
    var s = sentences[i];
    return s && s.text ? '<p class="bd-reader-near" data-sentence="' + i + '">' + texEscape(s.text) + '</p>' : '';
  }
  var items = sentences.map(function (s, i) {
    if (!s.text) return { title: s.title || '', html: s.html || '' };
    var notes = Object.keys(s.notes || {}).map(function (w) { return '<dt>' + texEscape(w) + '</dt><dd>' + texEscape(s.notes[w]) + '</dd>'; }).join('');
    return {
      title: s.title || s.pin || '',
      html: near(i - 1) + '<blockquote class="bd-quote bd-reader-current">' + mark(s) + '</blockquote>' + near(i + 1) +
        (notes ? '<dl class="bd-terms' + (Object.keys(s.notes).length > 3 ? ' bd-terms-2' : '') + '">' + notes + '</dl>' : '') + (s.gloss ? '<p class="bd-aside">' + texEscape(s.gloss) + '</p>' : '') + (s.html || ''),
    };
  });
  var p = panel(root, opts.opener, items, function (i) {
    cur = i;
    if (SPEAKING) window.speechSynthesis.cancel();
    if (opts.onFocus) opts.onFocus(i < 0 ? null : sentences[i]);
  });
  root.addEventListener('click', function (e) {
    var t = e.target.closest('[data-sentence]');
    if (t) p.go(+t.getAttribute('data-sentence'));
  });
  if (opts.lang) {
    var say = document.createElement('button');
    say.type = 'button';
    say.className = 'bd-btn';
    say.innerHTML = icon('speak') + '<span>朗读</span>';
    var foot = root.querySelector('.bd-panel-foot');
    foot.insertBefore(say, foot.firstChild);
    speakButton(say, function () { return sentences[Math.max(0, cur)].text || ''; }, opts.lang);
  }
  function index(id) { for (var i = 0; i < sentences.length; i++) if (sentences[i].id === id) return i; return -1; }
  return {
    // 画热点：place(s) 把 s.at 换算成 [x, y]（viewBox 坐标），返回 null 时不画（360° 里转到背后）。当前句的热点高亮，其余变淡。
    pins: function (parent, place) {
      sentences.forEach(function (s, i) {
        if (!s.at || !s.pin) return;
        var q = place ? place(s) : s.at;
        if (!q) return;
        var g = pin(parent, q[0], q[1], s.pin, { current: i === cur, below: s.below });
        if (cur >= 0 && i !== cur) g.classList.add('bd-dim');
        g.addEventListener('click', function () { p.open(i); });
      });
    },
    open: function (id) { p.open(index(id)); },
    close: p.close,
    current: function () { return cur < 0 ? null : sentences[cur]; },
    panel: p,
  };
}
</script>

// 放器材外形：art(parent, name, x, y, opts) 把后层画在 (x, y)，返回 { anchors, front() }。
// 器材函数先调它画外壳，再画刻度、指针、液面这些随数值变化的部分，最后调 front() 盖上玻璃反光。
// opts = { scale（等比缩放，默认 1）, flip（左右翻转） }。anchors 是外形上标好的锚点，已换算成画布坐标。
// 页面也可以直接调用，在图里摆一个现成外形（例如单独一团火焰）。名字见 instruments.md「画法：目录里没有的器材」。
function art(parent, name, x, y, opts) {
  opts = opts || {};
  var A = ART[name], s = opts.scale || 1, sx = opts.flip ? -s : s;
  if (!A) throw new Error('没有美术外形 ' + name);
  artDefs(parent);
  function layer(which) {
    if (!A[which]) return null;
    var g = svgEl(parent, 'g', { transform: 'translate(' + x + ',' + y + ') scale(' + sx + ',' + s + ')' }, 'bd-art');
    g.innerHTML = A[which];
    return g;
  }
  layer('back');
  var anchors = {};
  for (var k in A.anchors) anchors[k] = [x + A.anchors[k][0] * sx, y + A.anchors[k][1] * s];
  return { anchors: anchors, front: function () { return layer('front'); } };
}

// 把器材共用的渐变（url(#bd-g-*)）放进 parent 所在的 SVG，只放一次。art() 会自动调用；
// 器材只用代码画、又用了渐变时先调它，否则渐变退回纯色。
function artDefs(parent) {
  var svg = parent.ownerSVGElement || parent;
  if (svg.querySelector('#bd-art-defs')) return;
  var d = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  d.id = 'bd-art-defs';
  d.innerHTML = ART_DEFS;
  svg.insertBefore(d, svg.firstChild);
}

// —— 共用部件：器材函数和页面自画器材时都用这几个，画出来与图鉴里的器材同一个样子 ——

// 接线柱旋钮：(x, y) 是中心，r 是半径（电表 16，小电表 14，实物元件 12），左上一点高光。
// kind 为 'pos' 画红色正接线柱，'neg' 画黑色负接线柱，'off' 画没接入的灰色接线柱，不写画黄铜接线柱。返回 [x, y]。
function knob(parent, x, y, r, kind) {
  artDefs(parent);
  svgEl(parent, 'circle', { cx: x, cy: y, r: r }, 'bd-knob ' + ({ pos: 'bd-knob-pos', neg: 'bd-knob-neg', off: 'bd-knob-off' }[kind] || 'bd-brass'));
  svgEl(parent, 'circle', { cx: x - r / 4, cy: y - r / 4, r: r / 4, fill: '#FFFFFF', 'fill-opacity': 0.5 });
  return [x, y];
}

      dash(scene, L, [[m.px, m.py], [m.cx, m.cy]], 'observe');
    }
    mark(scene, A, [state.x, m.y], { name: 'P', color: 'subject' });
    mark(scene, A, [m.px, m.py], { name: 'Q', color: 'compare' });
  }

  /* 左下角状态一行：定义域、f(0) */
  var note = svgEl(scene, 'text', {
    x: 34, y: bottom - 6,
    style: 'fill:var(--text-2);font-size:23px'
  }, 'bd-note');
  note.textContent = '定义域关于原点对称：' + (m.domSym ? '是' : '否') +
    '　　f(0) = ' + (isNaN(m.f0) ? '无定义' : fmt(m.f0, 1));

  P.at(L.X(state.x), L.Y(m.y));
}

/* 结论默认遮住，由老师点读数揭开 */
coverable($('verdict').closest('.bd-reading'), null, true);

/* 探究问题（讲解面板）：四步，各自带一句结论 */
panel($('explain'), $('explain-btn'), [
  {
    title: '① 上下平移后谁还是偶函数',
    html: '<p>把图像上下平移 a 个单位，图像仍然关于 <strong>y 轴</strong> 镜像吗？</p>' +
          '<p class="bd-conclusion">偶函数上下平移后仍是偶函数：f(−x) = f(x) 这个等式里没有常数项，加 a 不改变它；但奇函数不行，因为 f(−x) = −f(x) 会被 a 破坏。</p>'
  },
  {
    title: '② 奇函数一平移为什么就不奇了',
    html: '<p>试 x³ 把 a 拉到 1，再看判断。</p>' +
          '<p class="bd-conclusion">奇函数的图像关于原点对称；上下移 a、左右移 b 都把对称中心从原点挪走了，新图像可能仍有中心对称，但不再是「关于原点」，所以不再叫奇函数。</p>'
  },
  {
    title: '③ f(0) 说明了什么',
    html: '<p>看左下角的 f(0)，再换几个函数和滑块值。</p>' +
          '<p class="bd-conclusion">奇函数若在原点有定义，必有 f(0) = 0；但 f(0) = 0 不能反过来断定是奇函数，例如 x² 也有 f(0) = 0。</p>'
  },
  {
    title: '④ 平移之后还有对称性吗',
    html: '<p>注意虚线的对称轴、紫色的对称中心还在不在。</p>' +
          '<p class="bd-conclusion">左右平移会把对称轴从 x = 0 移到 x = b；上下左右一起平移会把对称中心移到 (b, a)。对称性还在，只是对称轴、对称中心换了位置——所以它可能是「有对称性的非奇非偶函数」。</p>'
  }
], function () {});

toggles($('base'), function (i) {
  state.base = i;
  var c = BASE[i];
  state.x = Math.min(c.range[1], Math.max(c.range[0], state.x));
  if (c.gap && Math.abs(state.x) < c.gap) state.x = state.x >= 0 ? c.gap : -c.gap;
  draw();
});

$('sa').addEventListener('input', function (e) { state.a = parseFloat(e.target.value); draw(); });
$('sb').addEventListener('input', function (e) { state.b = parseFloat(e.target.value); draw(); });

zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.base = INIT.base; state.x = INIT.x; state.a = INIT.a; state.b = INIT.b;
  draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
